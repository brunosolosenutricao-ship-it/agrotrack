function abrirEditAtiv(id){
  var a=(window._cacheTodasAtividades||[]).find(function(x){return x.id===id;})
    || getAtividades().find(function(x){return x.id===id;});
  if(!a)return;
  // Convert escopo to object for easy lookup
  var escopoObj={};
  if(a.escopo==='geral'){escopoObj='geral';}
  else if(Array.isArray(a.escopo)){a.escopo.forEach(function(id2){escopoObj[id2]=true;});}
  else if(typeof a.escopo==='object'){escopoObj=Object.assign({},a.escopo);}
  state.editAtivData={id:a.id,nome:a.nome,mesAno:a.mesAno,escopo:escopoObj,grupo:a.grupo||'banco'};
  state.editAtivModal=true;
  render();
  // Bind pill toggles after modal renders
  setTimeout(function(){
    var geralCb=document.getElementById('edit-escopo-geral');
    if(geralCb){
      geralCb.onchange=function(){toggleEditGeral(this);};
    }
    document.querySelectorAll('.edit-escopo-btn').forEach(function(btn){
      var isActive=btn.dataset.selected==='1';
      if(isActive)btn.classList.add('sel-ativo');
      btn.onclick=function(){
        var ea=state.editAtivData;
        if(!ea||ea.escopo==='geral')return;
        if(!ea.escopo||typeof ea.escopo!=='object'||Array.isArray(ea.escopo)){
          // Convert array to object
          var obj={};
          if(Array.isArray(ea.escopo))ea.escopo.forEach(function(k){obj[k]=true;});
          ea.escopo=obj;
        }
        var clid=this.dataset.clid;
        var active=this.classList.toggle('sel-ativo');
        if(active){ea.escopo[clid]=true;}else{delete ea.escopo[clid];}
        this.style.borderColor=active?this.dataset.ucolor:'var(--border2)';
        this.style.color=active?this.dataset.ucolor:'var(--text2)';
        this.style.background=active?'rgba(0,0,0,.15)':'transparent';
      };
    });
    var btnSalvar=document.getElementById('btn-salvar-edit-ativ');
    if(btnSalvar)btnSalvar.onclick=salvarEditAtiv;
  },80);
}

function toggleEditGeral(el){
  var wrap=document.getElementById('edit-escopo-clientes');
  if(el.checked){
    state.editAtivData.escopo='geral';
    if(wrap){wrap.style.opacity='.4';wrap.style.pointerEvents='none';}
  } else {
    // Start with empty object so pills can be toggled
    state.editAtivData.escopo={};
    if(wrap){wrap.style.opacity='1';wrap.style.pointerEvents='auto';}
    // Re-bind pills now that they're active
    document.querySelectorAll('.edit-escopo-btn').forEach(function(btn){
      btn.classList.remove('sel-ativo');
      btn.style.borderColor='var(--border2)';
      btn.style.color='var(--text2)';
      btn.style.background='transparent';
    });
  }
}

async function salvarEditAtiv(){
  var ea=state.editAtivData;
  // Read grupo from radio buttons
  var nomeInput=document.getElementById('edit-ativ-nome');
  if(nomeInput&&nomeInput.value.trim())ea.nome=nomeInput.value.trim();
  var grupoRadio=document.querySelector('input[name="edit-ativ-grupo"]:checked');
  if(grupoRadio)ea.grupo=grupoRadio.value;
  var escopo=ea.escopo;
  if(typeof escopo==='object'&&escopo!=='geral'){
    var keys=Object.keys(escopo).filter(function(k){return escopo[k];});
    escopo=keys.length===0?'geral':keys;
  }
  var escopoStr=Array.isArray(escopo)?JSON.stringify(escopo):escopo;
  // Update local cache
  var ativs=getAtividades();
  var idx=ativs.findIndex(function(a){return a.id===ea.id;});
  if(idx>=0){ativs[idx].escopo=Array.isArray(escopo)?escopo:escopo;}
  setStore('atividades',ativs);_cacheAtividades=ativs;
  // Update _cacheTodasAtividades too
  if(window._cacheTodasAtividades){
    var idx2=window._cacheTodasAtividades.findIndex(function(a){return a.id===ea.id;});
    if(idx2>=0){
      window._cacheTodasAtividades[idx2].escopo=Array.isArray(escopo)?escopo:escopo;
      window._cacheTodasAtividades[idx2].grupo=ea.grupo||'banco';
      window._cacheTodasAtividades[idx2].nome=ea.nome;
    }
  }
  state.atividadesModificadas=true;
  await supaUpsertAtividade({id:ea.id,nome:ea.nome,mesAno:ea.mesAno,escopo:escopoStr,grupo:ea.grupo||'banco',ativo:'true'});
  showToast('✓ Escopo atualizado!');
  state.editAtivModal=false;
  render();
}

function removerAtiv(id){
  var ativs=getAtividades().filter(function(a){return a.id!==id;});
  setStore('atividades',ativs);_cacheAtividades=ativs;
  supaDelete('atividades',{id:id});
  showToast('Atividade removida');render();
}

function moverStatusCard(cardId,novoStatus){
  var cards=getCards();
  var idx=cards.findIndex(function(c){return c.id===cardId;});
  if(idx<0)return;
  cards[idx].status=novoStatus;
  cards[idx].atualizadoEm=new Date().toISOString();
  var payload={status:novoStatus,atualizado_em:cards[idx].atualizadoEm};
  if(novoStatus==='feito'&&!cards[idx].dataConclusao){
    cards[idx].dataConclusao=new Date().toISOString();

  }
  setStore('cards',cards);_cacheCards=cards;
  supaUpdate('cards',payload,{id:cardId}).catch(function(e){console.warn(e);showToast('Erro ao salvar o status no servidor');});
  showToast('Status: '+statusLabel(novoStatus));render();
}

async function transferirCard(cardId, novoDestino){
  if(!confirm('Transferir esta demanda para '+novoDestino.charAt(0).toUpperCase()+novoDestino.slice(1)+'?'))return;
  showToast('Transferindo...');
  var cards=getCards();
  var idx=cards.findIndex(function(c){return c.id===cardId;});
  if(idx>=0)cards[idx].destinatario=novoDestino;
  setStore('cards',cards);_cacheCards=cards;
  var res=await supaUpsertCard({id:cardId,destinatario:novoDestino});
  if(res&&res.ok){
    showToast('✓ Transferido para '+novoDestino+'!');
    state.lucasCardAberto=null;
    render();
  } else {
    showToast('Erro ao transferir');
  }
}

function handleFileSelect(input){

function removerDaFila(idx){state.lucasUploadQueue.splice(idx,1);render();}

async function enviarAnexosFila(cardId){
  if(!APPS_SCRIPT_URL){showToast('Configure a API primeiro');return;}
  var fila=state.lucasUploadQueue.slice();
  if(!fila.length)return;
  var card=getCards().find(function(c){return c.id===cardId;});
  var folderId=card?card.folderId:'';
  showToast('Enviando '+fila.length+' arquivo(s)...');
  var ok=0;
  for(var i=0;i<fila.length;i++){
    var f=fila[i];
    try{
      var base64=await lerBase64(f);
      var res=await supaUploadAnexo({cardId:cardId,folderId:folderId,
        nome:f.name,tipo:f.type,tamanho:String(f.size),base64:base64,enviadoPor:state.usuario});
      if(res&&res.ok){
        if(!state.lucasCardAnexos[cardId])state.lucasCardAnexos[cardId]=[];
        state.lucasCardAnexos[cardId].push({nome:f.name,tipo:f.type,tamanho:String(f.size),driveUrl:res.driveUrl,driveId:res.driveId,enviadoPor:state.usuario,enviadoEm:new Date().toISOString()});
        ok++;
      }
    }catch(e){console.warn('Upload erro:',e);}
  }
  state.lucasUploadQueue=[];
  showToast('✓ '+ok+'/'+fila.length+' enviado(s) para o Drive!');render();
}

function lerBase64(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(e){
      var b64=e.target.result.split(',')[1];
      resolve(b64);
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function removerAnexo(cardId,idx){
  var anexos=state.lucasCardAnexos[cardId]||[];
  var anexo=anexos[idx];
  if(!anexo)return;
  if(!confirm('Remover "'+anexo.nome+'" do Drive?'))return;
  if(APPS_SCRIPT_URL&&anexo.driveId){
    supaDelete('cards_anexos',{drive_id:anexo.driveId}).catch(function(e){console.warn(e);});
  }
  state.lucasCardAnexos[cardId].splice(idx,1);
  showToast('Anexo removido');render();
}

function initLucasJeanDnd(prefix){
  if(typeof Sortable==='undefined')return;
  var cols=['aberto','em_andamento','feito'];
  cols.forEach(function(st){
    var el=document.querySelector('.kanban-col-body.'+prefix+'-col-'+st);
    if(!el)return;
    // Destroy existing sortable if present
    if(el._sortable){el._sortable.destroy();el._sortable=null;}
    el._sortable=Sortable.create(el,{
      group:prefix+'-kanban',
      animation:150,
      ghostClass:'sortable-ghost',
      dragClass:'sortable-drag',
      filter:'button',
      preventOnFilter:false,
      onStart:function(evt){evt.item._dragging=true;},
      onEnd:function(evt){
        var id=evt.item.dataset.cardId;
        var novoStatus=evt.to.dataset.cardStatus;
        setTimeout(function(){evt.item._dragging=false;},200);
        if(!id||!novoStatus)return;
        if(evt.from===evt.to&&evt.oldIndex===evt.newIndex)return;
        moverStatusCard(id,novoStatus);
        render();
      }
    });

  });
}

async function salvarCliente(){
  var nome=(document.getElementById('cl-nome')||{}).value||'';
  if(!nome){showToast('Informe o nome');return;}
  var consultor=(document.getElementById('cl-cons')||{}).value||'igor';
  var regiao=(document.getElementById('cl-regiao')||{}).value||'';
  var area=Number((document.getElementById('cl-area')||{}).value||0);
  var d=state.modalClienteData;var id=d.id||(consultor[0]+Date.now());
  try{
    await supaInsert('clientes',{id:id,nome:nome,consultor:consultor,regiao:regiao,area:area,ativo:true},true);
    if(!CLIENTES[consultor])CLIENTES[consultor]=[];
    var idx=CLIENTES[consultor].findIndex(function(c){return c.id===id;});
    var cl={id:id,nome:nome,regiao:regiao,area:area};
    if(idx>=0)CLIENTES[consultor][idx]=cl;else CLIENTES[consultor].push(cl);
    TODOS_CLIENTES_FLAT=Object.keys(CLIENTES).reduce(function(acc,c){CLIENTES[c].forEach(function(cl){acc.push(Object.assign({},cl,{consultor:c}));});return acc;},[]);
    showToast('✓ Cliente salvo!');state.modalCliente=false;render();
  }catch(e){showToast('Erro: '+e.message);}
}
async function excluirCliente(id){
  if(!confirm('Excluir este cliente?'))return;
  try{
    await supaDelete('clientes',{id:id});
    Object.keys(CLIENTES).forEach(function(c){CLIENTES[c]=CLIENTES[c].filter(function(cl){return cl.id!==id;});});
    TODOS_CLIENTES_FLAT=TODOS_CLIENTES_FLAT.filter(function(cl){return cl.id!==id;});
    showToast('✓ Excluído!');render();
  }catch(e){showToast('Erro: '+e.message);}
}
async function salvarFazenda(){
  var nome=(document.getElementById('faz-nome')||{}).value||'';
  if(!nome){showToast('Informe o nome');return;}
  var area=Number((document.getElementById('faz-area')||{}).value||0);
  var lat=Number((document.getElementById('faz-lat')||{}).value)||null;
  var lng=Number((document.getElementById('faz-lng')||{}).value)||null;
  var estado=(document.getElementById('faz-estado')||{}).value||'';
  var df=state.modalFazendaData;var id=df.id||('faz'+Date.now());
  try{
    await supaInsert('fazendas',{id:id,cliente_id:df.clienteId,nome:nome,area:area,lat:lat,lng:lng,estado:estado},true);
    var idx=state.fazendas.findIndex(function(f){return f.id===id;});
    var row={id:id,cliente_id:df.clienteId,nome:nome,area:area,lat:lat,lng:lng,estado:estado};
    if(idx>=0)state.fazendas[idx]=row;else state.fazendas.push(row);
    setStore('fazendas',state.fazendas);
    showToast('✓ Fazenda salva!');state.modalFazenda=false;render();
    setTimeout(function(){desenharMapaModal(state.modalClienteData.id);},200);
  }catch(e){showToast('Erro: '+e.message);}
}
async function excluirFazenda(id){
  if(!confirm('Excluir esta fazenda?'))return;
  try{
    await supaDelete('fazendas',{id:id});
    state.fazendas=state.fazendas.filter(function(f){return f.id!==id;});
    setStore('fazendas',state.fazendas);showToast('✓ Removida!');render();
  }catch(e){showToast('Erro: '+e.message);}
}

};

function criarProjecao(svgId, fazendas){
  var el=document.getElementById(svgId);if(!el||!window.d3)return null;
  var bb=el.getBoundingClientRect();
  var w=bb.width||800;var h=bb.height||600;
  var proj=d3.geoMercator().fitSize([w,h],GEO_BRASIL);
  return {proj:proj,w:w,h:h,el:el};
}

function desenharMapa(svgId, fazendas, opts){
  opts=opts||{};
  var el=document.getElementById(svgId);
  if(!el||!window.d3||!window.GEO_BRASIL)return;
  var svg=d3.select('#'+svgId);
  svg.selectAll('*').remove();
  var vb=(el.getAttribute('viewBox')||'0 0 800 800').split(' ');
  var w=parseFloat(vb[2])||800;var h=parseFloat(vb[3])||600;
  // Pad slightly so states don't clip at edges
  var proj=d3.geoMercator().fitExtent([[10,10],[w-10,h-10]],GEO_BRASIL);
  var path=d3.geoPath().projection(proj);
  var tip=document.getElementById('mapa-tooltip');

  // Zoom state tracking (per SVG)
  if(!el._estadoZoom)el._estadoZoom=null;

  // Zoom group — everything goes inside this
  var zoomG=svg.append('g').attr('class','zoom-g');

  // Estados
  zoomG.selectAll('.estado-path')
    .data(GEO_BRASIL.features)
    .enter().append('path')
    .attr('class','estado-path')
    .attr('d',path)
    .attr('fill',opts.dark?'#1e1e1e':'#2a2a2a')
    .attr('stroke','#3a3a3a')
    .attr('stroke-width',0.5)
    .style('cursor',opts.zoom?'pointer':'default')
    .on('click', opts.zoom?function(event,d){
      abrirEstadoModal(d, d.properties.sigla||'PY');
    }:null);

  // Siglas dos estados (só no mapa grande)
  if(opts.labels){
    zoomG.selectAll('.estado-label')
      .data(GEO_BRASIL.features)
      .enter().append('text')
      .attr('class','estado-label')
      .attr('transform',function(d){var c=path.centroid(d);return'translate('+c+')';})
      .attr('text-anchor','middle')
      .attr('font-size',opts.labelSize||9)
      .attr('fill','#555')
      .attr('pointer-events','none')
      .text(function(d){return d.properties.sigla;});
  }

  // Pontos das fazendas
  var maxArea=d3.max(fazendas,function(f){return f.area||0;})||1;
  var rFixo=opts.rFixo||8;
  var rScale=d3.scaleSqrt().domain([0,maxArea]).range([4,opts.maxR||18]);

  fazendas.forEach(function(f){
    if(!f.lat||!f.lng)return;
    var cl=TODOS_CLIENTES_FLAT.find(function(c){return c.id===f.cliente_id;});
    if(!cl)return;
    var cor=CORES_CONS[cl.consultor]||'#8b90a8';
    var pt=proj([f.lng,f.lat]);
    if(!pt)return;
    var prop=opts.proporcional===undefined?true:opts.proporcional;
    var r=prop?Math.max(5, rScale(f.area||0)):rFixo;
    zoomG.append('circle')
      .attr('class','fazenda-dot')
      .attr('cx',pt[0]).attr('cy',pt[1]).attr('r',r)
      .attr('fill',cor).attr('fill-opacity',0.85)
      .attr('stroke','#111').attr('stroke-width',1.5)
      .on('mouseover',function(event){
        if(tip){tip.style.display='block';tip.innerHTML='<b>'+cl.nome+'</b><br>'+f.nome+'<br>'+(f.area||0).toLocaleString('pt-BR')+' ha';}
        d3.select(this).attr('r',r+4);
      })
      .on('mousemove',function(event){
        if(tip){tip.style.left=(event.clientX+12)+'px';tip.style.top=(event.clientY-20)+'px';}
      })
      .on('mouseout',function(){
        if(tip)tip.style.display='none';
        d3.select(this).attr('r',r);
      });
  });
}

function getFazendasFiltradas(){
  var fazs=state.fazendas||[];
  return fazs.filter(function(f){
    if(!f.lat||!f.lng)return false;
    var cl=TODOS_CLIENTES_FLAT.find(function(c){return c.id===f.cliente_id;});
    if(!cl)return false;
    if(_mapaFiltros.consultor!=='todos'&&cl.consultor!==_mapaFiltros.consultor)return false;
    if(_mapaFiltros.estado!=='todos'&&(f.estado||'')!==_mapaFiltros.estado)return false;
    if(_mapaFiltros.areaMin>0&&(f.area||0)<_mapaFiltros.areaMin)return false;
    if(_mapaFiltros.cliente!=='todos'&&f.cliente_id!==_mapaFiltros.cliente)return false;
    if(_mapaFiltros.fazenda!=='todos'&&f.id!==_mapaFiltros.fazenda)return false;
    return true;
  });
}

function desenharMapaGeral(){
  desenharMapa('mapa-geral', getFazendasFiltradas(), {labels:true,labelSize:9,maxR:20,proporcional:_mapaFiltros.proporcional,rFixo:8,zoom:true});
  requestAnimationFrame(function(){
    var el=document.getElementById('mapa-geral');
    if(!el||!window.d3)return;
    var svg=d3.select('#mapa-geral');
    var zoomG=svg.select('.zoom-g');
    if(zoomG.empty())return;
    try{svg.on('.zoom',null);}catch(e){}
    var z=d3.zoom().scaleExtent([1,14]).on('zoom',function(event){
      zoomG.attr('transform',event.transform);
    });
    el._d3zoom=z;
    svg.call(z);
  });
}
function mapaZoom(f){
  var el=document.getElementById('mapa-geral');
  if(!el||!el._d3zoom||!window.d3)return;
  d3.select('#mapa-geral').transition().duration(300).call(el._d3zoom.scaleBy,f);
}
function mapaZoomReset(){
  var el=document.getElementById('mapa-geral');
  if(!el||!el._d3zoom||!window.d3)return;
  d3.select('#mapa-geral').transition().duration(400).call(el._d3zoom.transform,d3.zoomIdentity);
}

function desenharMapaCons(cons){
  var fazs=(state.fazendas||[]).filter(function(f){
    if(!f.lat||!f.lng)return false;
    var cl=TODOS_CLIENTES_FLAT.find(function(c){return c.id===f.cliente_id;});
    return cl&&cl.consultor===cons;
  });
  desenharMapa('mapa-cons-'+cons, fazs, {labels:false,maxR:12});
}

function desenharMapaModal(cid){
  var fazs=getFazendasCliente(cid).filter(function(f){return f.lat&&f.lng;});
  if(!fazs.length){
    var el=document.getElementById('mapa-modal-svg');
    if(el){d3.select('#mapa-modal-svg').selectAll('*').remove();
      d3.select('#mapa-modal-svg').append('text').attr('x',190).attr('y',160).attr('text-anchor','middle').attr('fill','#555').attr('font-size',13).text('Sem fazendas com coordenadas');}
    return;
  }
  desenharMapa('mapa-modal-svg', fazs, {labels:false,maxR:14});
}

function abrirModalConsultor(cons){
  state.modalConsultor=cons;
  render();
  setTimeout(function(){
    desenharMapa('mapa-cons-modal',
      (state.fazendas||[]).filter(function(f){
        var cl=TODOS_CLIENTES_FLAT.find(function(c){return c.id===f.cliente_id;});
        return cl&&cl.consultor===cons&&f.lat&&f.lng;
      }),
      {labels:false,maxR:14});
  },200);
}

function abrirEstadoModal(feature, sigla){
  if(!window.d3||!window.GEO_BRASIL)return;
  var overlay=document.getElementById('estado-overlay');
  var box=document.getElementById('estado-box');
  var svgEl=document.getElementById('estado-svg');
  var nomeEl=document.getElementById('estado-nome');
  if(!overlay||!box||!svgEl)return;

  var W=Math.min(window.innerWidth*0.85, 700);
  var H=Math.min(window.innerHeight*0.80, 560);
  svgEl.setAttribute('width', W);
  svgEl.setAttribute('height', H);
  svgEl.setAttribute('viewBox','0 0 '+W+' '+H);

  var svg=d3.select('#estado-svg');
  svg.selectAll('*').remove();

  // Project just this feature
  var proj=d3.geoMercator().fitExtent([[20,20],[W-20,H-20]], feature);
  var path=d3.geoPath().projection(proj);

  // Draw state outline
  svg.append('path')
    .datum(feature)
    .attr('d',path)
    .attr('fill','#1e2530')
    .attr('stroke','#4ade80')
    .attr('stroke-width',1.5);

  // Draw fazenda dots
  var tip=document.getElementById('mapa-tooltip');
  var maxArea=d3.max(state.fazendas||[],function(f){return f.area||0;})||1;
  var rScale=d3.scaleSqrt().domain([0,maxArea]).range([5,22]);
  (state.fazendas||[]).forEach(function(f){
    if(!f.lat||!f.lng)return;
    // Check if point is in this feature (rough bbox check then visual)
    var pt=proj([f.lng,f.lat]);
    if(!pt)return;
    if(pt[0]<0||pt[0]>W||pt[1]<0||pt[1]>H)return;
    var cl=TODOS_CLIENTES_FLAT.find(function(c){return c.id===f.cliente_id;});
    if(!cl)return;
    // Filter: only fazendas with estado matching sigla (or all if PY)
    if(sigla!=='PY'&&f.estado&&f.estado!==sigla)return;
    if(sigla==='PY'&&f.estado!=='PY')return;
    var cor=CORES_CONS[cl.consultor]||'#8b90a8';
    var prop=_mapaFiltros.proporcional;
    var r=prop?Math.max(6,rScale(f.area||0)):9;
    svg.append('circle')
      .attr('cx',pt[0]).attr('cy',pt[1]).attr('r',r)
      .attr('fill',cor).attr('fill-opacity',0.9)
      .attr('stroke','#111').attr('stroke-width',1.5)
      .style('cursor','default')
      .on('mouseover',function(event){
        if(tip){tip.style.display='block';tip.innerHTML='<b>'+cl.nome+'</b><br>'+f.nome+'<br>'+(f.area||0).toLocaleString('pt-BR')+' ha';}
      })
      .on('mousemove',function(event){
        if(tip){tip.style.left=(event.clientX+12)+'px';tip.style.top=(event.clientY-20)+'px';}
      })
      .on('mouseout',function(){if(tip)tip.style.display='none';});
  });

  // Nome do estado
  if(nomeEl)nomeEl.textContent=feature.properties.name||feature.properties.sigla||sigla;

  // Animate in
  overlay.classList.add('active');
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      box.classList.add('active');
    });
  });
}

function fecharEstadoModal(){
  var overlay=document.getElementById('estado-overlay');
  var box=document.getElementById('estado-box');
  var tip=document.getElementById('mapa-tooltip');
  if(tip)tip.style.display='none';
  if(box)box.classList.remove('active');
  setTimeout(function(){
    if(overlay)overlay.classList.remove('active');
  },400);
}

function bindCadastros(){
  // Bind buttons inside consultor modal
  var btnNovoCl=document.getElementById('btn-novo-cl-cons');
  if(btnNovoCl)btnNovoCl.onclick=function(){abrirNovoCliente(this.dataset.cons);};
  document.querySelectorAll('[data-id]').forEach(function(btn){
    if(btn.getAttribute('onclick') && btn.getAttribute('onclick').includes('abrirEditCliente')){
      btn.onclick=function(){abrirEditCliente(this.dataset.id);};
    }
    if(btn.getAttribute('onclick') && btn.getAttribute('onclick').includes('excluirCliente')){
      btn.onclick=function(){excluirCliente(this.dataset.id);};
    }
  });
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    if(document.getElementById('mapa-geral'))desenharMapaGeral();
    ['igor','felipe','paula','ramon'].forEach(function(c){
      if(document.getElementById('mapa-cons-'+c))desenharMapaCons(c);
    });
    if(document.getElementById('mapa-cons-modal')&&state.modalConsultor){
      desenharMapa('mapa-cons-modal',
        (state.fazendas||[]).filter(function(f){
          var cl=TODOS_CLIENTES_FLAT.find(function(c){return c.id===f.cliente_id;});
          return cl&&cl.consultor===state.modalConsultor&&f.lat&&f.lng;
        }),{labels:false,maxR:14});
    }
    if(document.getElementById('mapa-cliente-modal')&&state.modalCliente&&state.modalClienteData.id){
      desenharMapaModal(state.modalClienteData.id);
    }
  });});
}

async function initApp(){
  // Wait for Supabase SDK to load
  var tries=0;
  while(!window.supabase&&tries<20){await new Promise(function(r){setTimeout(r,100);});tries++;}
  if(!window.supabase){console.error('Supabase SDK nao carregou');render();return;}
  try{
    var usRows = await supa('usuarios',{select:'*'});
    usRows.forEach(function(u){
      USUARIOS[u.usuario]={senha:u.senha,role:u.role,nome:u.nome,cor:u.cor,corBg:u.cor_bg};
    });
  }catch(e){console.warn('Erro ao carregar usuários:',e);}
  render();
}
initApp();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister();});});;
  });
}
</script>
