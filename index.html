<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AgroTrack</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AgroTrack">
<meta name="theme-color" content="#4ade80">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html,body{background:#0f1117!important;color:#f0f2f8!important;}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#222534;--surface3:#2a2e3f;
  --accent:#4ade80;--accent2:#22c55e;--accent-light:rgba(74,222,128,.1);
  --text:#f0f2f8;--text2:#8b90a8;--text3:#555a75;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --danger:#f87171;--warn:#fbbf24;--ok:#4ade80;
  --lucas:#f472b6;--lucas-bg:rgba(244,114,182,.1);
  --radius:12px;--mono:'DM Mono',monospace;--sans:'Sora',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}html,body{overflow-x:hidden;max-width:100vw;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--surface);border-radius:20px;padding:48px 40px;width:360px;border:1px solid var(--border2);}
.login-logo{font-size:10px;font-family:var(--mono);letter-spacing:4px;color:var(--text3);text-transform:uppercase;margin-bottom:8px;}
.login-title{font-size:28px;font-weight:600;margin-bottom:32px;color:var(--text);}
.login-title span{color:var(--accent);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-family:var(--mono);color:var(--text2);margin-bottom:6px;letter-spacing:1px;}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:8px;font-family:var(--sans);font-size:14px;background:var(--surface2);color:var(--text);outline:none;}
.field input:focus,.field select:focus{border-color:var(--accent);}
.field select option{background:var(--surface2);}
.btn-primary{width:100%;padding:14px;background:var(--accent);color:#0a1a0f;border:none;border-radius:8px;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;}
.btn-primary:hover{background:var(--accent2);}
.error-msg{color:var(--danger);font-size:12px;margin-top:10px;text-align:center;font-family:var(--mono);}
/* APP LAYOUT */
.app{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--surface);padding:24px 0;display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--border);}
.sidebar-logo{font-size:10px;font-family:var(--mono);letter-spacing:3px;color:var(--text3);padding:0 20px 24px;border-bottom:1px solid var(--border);}
.sidebar-logo strong{display:block;font-family:var(--sans);font-size:18px;font-weight:600;color:var(--accent);letter-spacing:0;margin-top:2px;}
.sidebar-user{padding:16px 20px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.sidebar-user-name{font-size:13px;font-weight:500;}
.sidebar-user-role{font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:2px;}
.nav-item{padding:10px 20px;color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .15s;border-left:3px solid transparent;}
.nav-item:hover{color:var(--text);background:var(--surface2);}
.nav-item.active{color:var(--accent);background:var(--accent-light);border-left-color:var(--accent);}
.nav-item.nav-lucas{color:var(--lucas);}
.nav-item.nav-lucas:hover{background:var(--lucas-bg);}
.nav-item.nav-lucas.active{color:var(--lucas);background:var(--lucas-bg);border-left-color:var(--lucas);}
.nav-icon{width:16px;height:16px;opacity:.5;flex-shrink:0;}
.nav-item.active .nav-icon,.nav-item:hover .nav-icon{opacity:1;}
.sidebar-bottom{margin-top:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px;}
.btn-logout{width:100%;padding:9px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-family:var(--sans);font-size:12px;cursor:pointer;}
.btn-logout:hover{background:var(--surface3);color:var(--text);}
.main{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0;}
.page{padding:32px;max-width:1200px;}
.page-header{margin-bottom:28px;}
.page-title{font-size:22px;font-weight:600;}
.page-sub{font-size:13px;color:var(--text3);margin-top:4px;font-family:var(--mono);}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:20px;}
.cards-grid{display:grid;gap:16px;}
.cards-grid.cols-4{grid-template-columns:repeat(4,1fr);}
.cards-grid.cols-2{grid-template-columns:repeat(2,1fr);}
.metric-label{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:1px;margin-bottom:8px;}
.metric-value{font-size:28px;font-weight:600;}
.metric-sub{font-size:12px;color:var(--text2);margin-top:4px;}
.month-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.month-bar select{padding:8px 12px;border:1px solid var(--border2);border-radius:8px;font-family:var(--sans);font-size:13px;background:var(--surface2);color:var(--text);cursor:pointer;}
.ranking-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);min-width:0;}
.ranking-row:last-child{border-bottom:none;}
.rank-num{font-size:11px;font-family:var(--mono);color:var(--text3);width:20px;}
.rank-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.rank-name{font-size:14px;font-weight:500;flex:1;}
.rank-clients{font-size:12px;font-family:var(--mono);color:var(--text3);}
.rank-score{font-size:16px;font-weight:600;font-family:var(--mono);}
.progress-bar{height:3px;background:var(--surface3);border-radius:2px;margin-top:5px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;transition:width .4s;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:10px 12px;font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:1px;border-bottom:1px solid var(--border);font-weight:400;}
td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2)!important;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-family:var(--mono);font-weight:500;}
.badge-ok{background:rgba(74,222,128,.12);color:#4ade80;}
.badge-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.badge-info{background:rgba(96,165,250,.12);color:#60a5fa;}
.badge-warn{background:rgba(251,191,36,.12);color:#fbbf24;}
.badge-danger{background:rgba(248,113,113,.12);color:#f87171;}
.badge-lucas{background:var(--lucas-bg);color:var(--lucas);}
.ativ-fill-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.ativ-fill-row:last-child{border-bottom:none;}
.ativ-fill-name{flex:1;font-size:13px;}
.ativ-fill-select{padding:6px 10px;border:1px solid var(--border2);border-radius:6px;font-family:var(--mono);font-size:12px;background:var(--surface2);color:var(--text);cursor:pointer;min-width:210px;font-weight:500;transition:all .15s;}
.ativ-fill-select:focus{outline:none;border-color:var(--accent);}
.ativ-fill-select option{background:var(--surface2);}
.ativ-fill-select.cod-10{background:#14532d;color:#4ade80;border-color:#166534;}
.ativ-fill-select.cod-nao{background:#422006;color:#fbbf24;border-color:#854d0e;}
.ativ-fill-select.cod-0{background:#450a0a;color:#f87171;border-color:#7f1d1d;}
.ativ-fill-select.cod-5{background:#431407;color:#fb923c;border-color:#9a3412;}
.ativ-fill-select.cod-cotacao{background:#3b0764;color:#c084fc;border-color:#6b21a8;}
.ativ-fill-select.cod-ind{background:#0c2044;color:#60a5fa;border-color:#1e40af;}
.ativ-fill-select.cod-cliente{background:#042f2e;color:#2dd4bf;border-color:#0f766e;}
.ativ-fill-select.cod-timing{background:#4a044e;color:#f0abfc;border-color:#86198f;}
.ativ-fill-select.cod-semresp{background:#450a0a;color:#fca5a5;border-color:#991b1b;}
.ativ-nota{font-size:12px;font-family:var(--mono);color:var(--text3);min-width:30px;text-align:right;}
.btn-save{padding:10px 24px;background:var(--accent);color:#0a1a0f;border:none;border-radius:8px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;}
.btn-save:hover{background:var(--accent2);}
.btn-save:disabled{opacity:.4;cursor:not-allowed;}
.btn-sec{padding:10px 18px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:8px;font-family:var(--sans);font-size:13px;cursor:pointer;}
.btn-sec:hover{border-color:var(--accent);color:var(--accent);}
.btn-lucas{padding:10px 20px;background:var(--lucas);color:#1a0010;border:none;border-radius:8px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;}
.btn-lucas:hover{background:#e879f9;}
.scope-group{margin-bottom:10px;}
.scope-group-label{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:1px;margin-bottom:6px;}
.check-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;}
.check-item:hover{background:var(--surface3);}
.check-item input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex-shrink:0;}
.scope-scroll{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--surface2);}
.filtro-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.filtro-tab{padding:6px 16px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--text2);}
.filtro-tab:hover{border-color:var(--accent);color:var(--accent);}
.filtro-tab.active{background:var(--accent);color:#0a1a0f;border-color:var(--accent);font-weight:600;}
.section-title{font-size:11px;font-weight:500;color:var(--text3);margin-bottom:12px;font-family:var(--mono);letter-spacing:1.5px;}
.nota-zero{background:rgba(248,113,113,.06)!important;border-left:3px solid #f87171;}
.nota-cinco{background:rgba(251,191,36,.06)!important;border-left:3px solid #fbbf24;}
.nota-dez{background:rgba(74,222,128,.06)!important;border-left:3px solid #4ade80;}
.nota-zero td,.nota-cinco td,.nota-dez td{background:transparent!important;}
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;cursor:pointer;transition:all .15s;}
.client-card:hover{border-color:var(--accent);}
.client-card.selected{border-color:var(--accent);background:var(--accent-light);}
.clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:24px;}
/* Custom scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--text3);}

.kanban-col-body.drag-over{background:var(--accent-light);border:1px dashed var(--accent);border-radius:8px;}
.sortable-ghost{opacity:0.3;}
.kanban-col-body.sortable-over .plan-empty{display:none;}
.sortable-drag{opacity:0.9;transform:rotate(2deg);box-shadow:0 8px 24px rgba(0,0,0,.4);}
/* Progress bar de carregamento */
.progress-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9998;}
.progress-screen-title{font-size:22px;font-weight:700;color:#4ade80;font-family:var(--sans);}
.progress-screen-sub{font-size:12px;font-family:var(--mono);color:var(--text3);min-height:16px;}
.progress-bar-wrap{width:280px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#4ade80,#60a5fa);border-radius:3px;transition:width .3s ease;}
/* Barra de salvando no topo */
.saving-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;background:transparent;}
.saving-bar.active{background:linear-gradient(90deg,#4ade80,#60a5fa,#4ade80);background-size:200% 100%;animation:savingAnim 1s linear infinite;}
@keyframes savingAnim{0%{background-position:0% 0%;}100%{background-position:200% 0%;}}

.toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:12px 20px;border-radius:10px;font-size:13px;font-family:var(--mono);opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;z-index:9999;}
.toast.show{opacity:1;transform:translateY(0);}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:32px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:18px;font-weight:600;margin-bottom:20px;color:var(--text);}
.modal-field{margin-bottom:16px;}
.modal-field label{display:block;font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:1px;margin-bottom:6px;}
.modal-field input,.modal-field select,.modal-field textarea{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:8px;font-family:var(--sans);font-size:13px;background:var(--surface2);color:var(--text);outline:none;resize:vertical;}
.modal-field input:focus,.modal-field select:focus,.modal-field textarea:focus{border-color:var(--lucas);}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
/* KANBAN */
.kanban-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
.kanban-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.kanban-col-header{padding:14px 16px;font-size:11px;font-family:var(--mono);letter-spacing:2px;font-weight:500;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.kanban-col-header.aberto{color:#60a5fa;background:rgba(96,165,250,.08);}
.kanban-col-header.em_andamento{color:#fbbf24;background:rgba(251,191,36,.08);}
.kanban-col-header.feito{color:#4ade80;background:rgba(74,222,128,.08);}
.kanban-col-body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px;}
.kanban-card{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;}
.kanban-card:hover{border-color:var(--lucas);transform:translateY(-1px);}
.kanban-card-title{font-size:13px;font-weight:500;margin-bottom:6px;line-height:1.4;}
.kanban-card-meta{font-size:11px;font-family:var(--mono);color:var(--text3);display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.kanban-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.kanban-card-autor{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:4px;font-weight:500;}
.kanban-card-nota{font-size:12px;font-family:var(--mono);font-weight:600;}
.prioridade-badge{font-size:10px;font-family:var(--mono);font-weight:600;padding:2px 8px;border-radius:4px;letter-spacing:.5px;}
.prioridade-alta{background:rgba(248,113,113,.18);color:#f87171;border:1px solid rgba(248,113,113,.4);}
.prioridade-media{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.35);}
.prioridade-baixa{background:rgba(96,165,250,.15);color:#60a5fa;border:1px solid rgba(96,165,250,.35);}
.prazo-badge{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:4px;}
.prazo-ok{color:#4ade80;background:rgba(74,222,128,.1);}
.prazo-warn{color:#fbbf24;background:rgba(251,191,36,.12);}
.prazo-late{color:#f87171;background:rgba(248,113,113,.15);}
/* CARD DETALHE */
.card-detalhe{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:24px;margin-top:20px;}
.card-detalhe-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;}
.card-detalhe-title{font-size:18px;font-weight:600;line-height:1.3;}
.card-detalhe-meta{font-size:12px;font-family:var(--mono);color:var(--text3);margin-top:4px;}
.card-detalhe-section{margin-bottom:20px;}
.card-detalhe-section-label{font-size:10px;font-family:var(--mono);color:var(--text3);letter-spacing:2px;margin-bottom:8px;}
/* ANEXOS */
.anexos-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.anexo-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;}
.anexo-icon{font-size:16px;flex-shrink:0;}
.anexo-nome{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.anexo-size{font-size:10px;font-family:var(--mono);color:var(--text3);}
.anexo-link{font-size:11px;color:#60a5fa;text-decoration:none;font-family:var(--mono);}
.anexo-link:hover{text-decoration:underline;}
.upload-area{border:2px dashed var(--border2);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;margin-top:8px;}
.upload-area:hover,.upload-area.drag{border-color:var(--lucas);background:var(--lucas-bg);}
.upload-area input{display:none;}
.upload-area-text{font-size:12px;font-family:var(--mono);color:var(--text3);}
/* STATUS BUTTONS */
.status-btns{display:flex;gap:8px;flex-wrap:wrap;}
.status-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--text2);transition:all .15s;}
.status-btn:hover{border-color:var(--text2);}
.status-btn.aberto.active{background:rgba(96,165,250,.15);border-color:#60a5fa;color:#60a5fa;}
.status-btn.em_andamento.active{background:rgba(251,191,36,.15);border-color:#fbbf24;color:#fbbf24;}
.status-btn.feito.active{background:rgba(74,222,128,.15);border-color:#4ade80;color:#4ade80;}
/* NOTA STARS */
.nota-input-wrap{display:flex;gap:6px;align-items:center;}
.nota-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--text3);font-family:var(--mono);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.nota-btn:hover{border-color:var(--accent);color:var(--accent);}
.nota-btn.active{background:rgba(74,222,128,.2);border-color:var(--accent);color:var(--accent);font-weight:700;}
/* RESPONSIVO MOBILE */
@media(max-width:768px){
  .app{flex-direction:column;}
  .sidebar{
    width:100%;height:60px;flex-direction:row;
    position:fixed;bottom:0;left:0;right:0;
    padding:0;z-index:100;
    border-right:none;border-top:1px solid var(--border2);
    background:var(--surface);
    display:flex;align-items:stretch;
  }
  .sidebar-logo,.sidebar-user,.sidebar-bottom{display:none!important;}
  .nav-item{
    flex:1;flex-direction:column;
    padding:8px 4px 6px;gap:3px;
    border-left:none!important;border-top:3px solid transparent;
    justify-content:center;align-items:center;
    font-size:10px;min-width:0;
  }
  .nav-item.active{border-top-color:var(--accent);background:var(--accent-light);}
  .nav-item.nav-lucas.active{border-top-color:var(--lucas);background:var(--lucas-bg);}
  .nav-item span{display:block;font-size:9px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .nav-icon{width:20px;height:20px;opacity:1;flex-shrink:0;}
  .main{padding-bottom:72px;width:100%;}
  .page{padding:16px;}
  .cards-grid.cols-4{grid-template-columns:repeat(2,1fr);}
  .cards-grid.cols-2{grid-template-columns:1fr;}
  .kanban-wrap{grid-template-columns:1fr;}
  .ranking-row{flex-wrap:wrap;gap:8px;}
  .rank-score,.rank-clients{flex-basis:auto;}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{min-width:480px;}
  .page-title{font-size:20px;}

async function apiCall(p){
  if(!APPS_SCRIPT_URL)return null;
  try{
    var r=await fetch(APPS_SCRIPT_URL+'?'+new URLSearchParams(p).toString(),{redirect:'follow'});
    return JSON.parse(await r.text());
  }catch(e){console.warn('API:',e);return null;}
}

}

async function sincronizarDoSheets(){

    showProgress(15,'Buscando atividades...');
    var aR=await apiCall({action:'getAtividades'});
    showProgress(40,'Buscando registros...');
    var rR=await apiCall({action:'getRegistros'});
    showProgress(70,'Buscando demandas...');
    var cR=await apiCall({action:'getCards'});
    showProgress(90,'Finalizando...');
    var ok=false;
    if(aR&&!aR.erro&&Array.isArray(aR)&&aR.length>0){
      var n=aR.map(function(a){return Object.assign({},a,{ativo:a.ativo===true||String(a.ativo).toUpperCase()==='TRUE'});});
      setStore('atividades',n);_cacheAtividades=n;ok=true;
    }
    if(rR&&!rR.erro&&Array.isArray(rR)&&rR.length>0){
      var nr=rR.map(function(r){return Object.assign({},r,{nota:Number(r.nota)});});
      setStore('registros',nr);_cacheRegistros=nr;ok=true;
    }
    if(cR&&!cR.erro&&Array.isArray(cR)){
      setStore('cards',cR);_cacheCards=cR;ok=true;
    }
    showProgress(100,'Pronto!');
    setTimeout(hideProgress,500);
    showToast(ok?'✓ Atualizado!':'⚠ Sem dados');return ok;
  }catch(e){hideProgress();showToast('Erro ao sincronizar');return false;}
  finally{_sincronizando=false;}
}

function showProgress(pct,msg){

}

function hideProgress(){

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

function prioridadeCls(p){return p==='alta'?'prioridade-alta':p==='media'?'prioridade-media':'prioridade-baixa';}
function calcPrazo(dataEntrega){
  if(!dataEntrega||dataEntrega==='null'||dataEntrega==='')return null;
  var hoje=new Date();hoje.setHours(0,0,0,0);
  var d=new Date(dataEntrega+'T00:00:00');
  var diff=Math.round((d-hoje)/(1000*60*60*24));
  return diff;
}
function prazoHTML(dataEntrega, status, dataConclusao){
  if(status==='feito'){
    if(dataEntrega&&dataConclusao){
      try{
        var prazo=new Date(dataEntrega+'T00:00:00');
        var concl=new Date(dataConclusao);
        concl.setHours(0,0,0,0);
        var diff=Math.round((concl-prazo)/(1000*60*60*24));
        if(diff<0)return'<span class="prazo-badge prazo-ok">✓ '+Math.abs(diff)+'d antes do prazo</span>';
        if(diff===0)return'<span class="prazo-badge prazo-ok">✓ No prazo</span>';
        return'<span class="prazo-badge prazo-late">✓ '+diff+'d de atraso</span>';
      }catch(e){}
    }
    return'<span class="prazo-badge prazo-ok">✓ Entregue</span>';
  }
  var diff=calcPrazo(dataEntrega);
  if(diff===null)return'';
  if(diff<0)return'<span class="prazo-badge prazo-late">'+Math.abs(diff)+'d atrasado</span>';
  if(diff===0)return'<span class="prazo-badge prazo-warn">vence hoje</span>';
  if(diff<=3)return'<span class="prazo-badge prazo-warn">'+diff+'d restantes</span>';
  return'<span class="prazo-badge prazo-ok">'+diff+'d restantes</span>';
}
function fmtBytes(b){if(!b)return'';b=Number(b);if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB';}
function fileIcon(tipo){
  if(!tipo)return'📄';

  if(tipo.includes('word')||tipo.includes('doc'))return'📝';
  if(tipo.includes('pdf'))return'📕';
  if(tipo.includes('presentation')||tipo.includes('pptx')||tipo.includes('ppt'))return'📊';
  if(tipo.includes('image'))return'🖼️';
  return'📎';
}

function escopoInclui(escopo,clienteId){
  if(!escopo)return false;if(escopo==='geral')return true;
  var e=escopo;if(typeof e==='string'){try{e=JSON.parse(e);}catch(x){}}
  if(Array.isArray(e))return e.indexOf(clienteId)>=0;
  return String(e)===String(clienteId);
}
function calcNota(consultor,clienteId,mesAno){
  var ativs=getAtividades().filter(function(a){return a.mesAno===mesAno&&a.ativo&&escopoInclui(a.escopo,clienteId);});
  if(!ativs.length)return null;
  var regs=getRegistros().filter(function(r){return r.consultor===consultor&&r.clienteId===clienteId&&r.mesAno===mesAno;});
  var soma=0,total=0;
  ativs.forEach(function(a){total+=10;var r=regs.find(function(r){return r.atividadeId===a.id;});if(r)soma+=r.nota;});
  return total>0?Math.round((soma/total)*100):0;
}
function calcNotaConsultor(consultor,mesAno){
  var cls=CLIENTES[consultor]||[];if(!cls.length)return 0;
  var sum=0,cnt=0;
  cls.forEach(function(c){var n=calcNota(consultor,c.id,mesAno);if(n!==null){sum+=n;cnt++;}});
  return cnt>0?Math.round(sum/cnt):0;
}
function calcNotaLucas(mesAno){
  var cards=getCards().filter(function(c){return c.mesAno===mesAno&&c.status==='feito'&&c.nota!==null&&c.nota!==''&&!isNaN(Number(c.nota));});
  if(!cards.length)return null;
  var soma=cards.reduce(function(s,c){return s+Number(c.nota)*10;},0);
  return Math.round(soma/cards.length);
}
function calcNotaJean(mesAno){
  var cards=getCards().filter(function(c){return c.mesAno===mesAno&&c.destinatario==='jean'&&c.status==='feito'&&c.nota!==null&&c.nota!==''&&!isNaN(Number(c.nota));});
  if(!cards.length)return null;
  var soma=cards.reduce(function(s,c){return s+Number(c.nota)*10;},0);
  return Math.round(soma/cards.length);
}

function progresso(consultor,mesAno){
  var cls=CLIENTES[consultor]||[];
  var ativs=getAtividades().filter(function(a){return a.mesAno===mesAno&&a.ativo;});
  var total=0,feito=0;
  cls.forEach(function(cl){
    var a=ativs.filter(function(a){return escopoInclui(a.escopo,cl.id);});
    total+=a.length;
    var regsCliente=getRegistros().filter(function(r){return r.consultor===consultor&&r.clienteId===cl.id&&r.mesAno===mesAno;});
    feito+=a.filter(function(atv){return regsCliente.find(function(r){return r.atividadeId===atv.id;});}).length;
  });
  return total>0?Math.round((feito/total)*100):0;
}
function calcPendencias(mesAno){
  var ativs=getAtividades().filter(function(a){return a.mesAno===mesAno&&a.ativo;});
  var total=0;
  ['igor','felipe','paula','ramon'].forEach(function(c){
    CLIENTES[c].forEach(function(cl){
      var ac=ativs.filter(function(a){return escopoInclui(a.escopo,cl.id);});
      var regs=getRegistros().filter(function(r){return r.consultor===c&&r.clienteId===cl.id&&r.mesAno===mesAno;});
      ac.forEach(function(a){if(!regs.find(function(r){return r.atividadeId===a.id;}))total++;});
    });
  });
  return total;
}
function calcClientesAbaixo50(mesAno){
  var lista=[];
  ['igor','felipe','paula','ramon'].forEach(function(c){
    CLIENTES[c].forEach(function(cl){
      var n=calcNota(c,cl.id,mesAno);
      if(n!==null&&n<50)lista.push({consultor:c,nome:cl.nome,nota:n,regiao:cl.regiao});
    });
  });
  lista.sort(function(a,b){return a.nota-b.nota;});return lista;
}

function adicionarAoBuffer(reg){
  var key=reg.consultor+'|'+reg.clienteId+'|'+reg.atividadeId+'|'+reg.mesAno;
  _bufferRegistros[key]=reg;
  if(_bufferTimer)clearTimeout(_bufferTimer);
  _bufferTimer=setTimeout(function(){despejarBuffer();},1500);
}
async function despejarBuffer(){
  var lote=Object.values(_bufferRegistros);
  if(!lote.length)return;
  _bufferRegistros={};_bufferTimer=null;
  if(!APPS_SCRIPT_URL)return;
  try{
    var t=new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},15000);});
    await Promise.race([apiCall({action:'salvarRegistros',registros:JSON.stringify(lote)}),t]);
  }catch(e){
    lote.forEach(function(r){var k=r.consultor+'|'+r.clienteId+'|'+r.atividadeId+'|'+r.mesAno;_bufferRegistros[k]=r;});
    _bufferTimer=setTimeout(function(){despejarBuffer();},5000);
  }
}
async function salvarRegistrosLote(lote){
  if(!APPS_SCRIPT_URL||!lote.length)return;
  try{
    var t=new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},15000);});
    await Promise.race([apiCall({action:'salvarRegistros',registros:JSON.stringify(lote)}),t]);
  }catch(e){console.warn('Erro lote:',e);}
}
function salvarRegistro(consultor,clienteId,atividadeId,codigo,mesAno){
  var regs=getRegistros();
  var idx=regs.findIndex(function(r){return r.consultor===consultor&&r.clienteId===clienteId&&r.atividadeId===atividadeId&&r.mesAno===mesAno;});
  var c=CODIGOS.find(function(c){return c.codigo===codigo;});var nota=c?c.nota:0;
  var reg={consultor:consultor,clienteId:clienteId,atividadeId:atividadeId,codigo:codigo,nota:nota,mesAno:mesAno,ts:Date.now()};
  if(idx>=0)regs[idx]=reg;else regs.push(reg);
  setStore('registros',regs);_cacheRegistros=regs;adicionarAoBuffer(reg);return reg;
}

    state.historico=res;
    setStore('historico',res);
  } else {
    state.historico=getStore('historico',[]);
  }

}

async function salvarNotaHistorico(){
  var d=state.historicoModalData;
  var mesAno=(document.getElementById('h-mes')||{}).value||d.mesAno||'';
  var pessoa=(document.getElementById('h-pessoa')||{}).value||'';
  var nota=parseInt((document.getElementById('h-nota')||{}).value||'0');
  if(!mesAno){showToast('Informe o mês');return;}
  if(!pessoa){showToast('Informe a pessoa');return;}
  if(isNaN(nota)||nota<0||nota>100){showToast('Nota inválida (0-100)');return;}
  var payload={action:'salvarNotaHistorico',mesAno:mesAno,pessoa:pessoa,nota:nota,criadoPor:state.usuario};

function fmtDataHora(dh){
  if(!dh)return'';
  try{
    var d=new Date(dh);
    var dia=String(d.getDate()).padStart(2,'0');
    var mes=String(d.getMonth()+1).padStart(2,'0');
    var h=String(d.getHours()).padStart(2,'0');
    var mi=String(d.getMinutes()).padStart(2,'0');
    return dia+'/'+mes+' '+h+':'+mi;
  }catch(e){return dh;}
}

function normalizeTime(val){
  if(!val)return'';
  // Already HH:MM format
  if(/^\d{2}:\d{2}$/.test(val))return val;
  // Try parsing AM/PM
  try{
    var m=val.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if(m){
      var h=parseInt(m[1]);
      var mi=m[2];
      var ampm=m[3].toUpperCase();
      if(ampm==='PM'&&h!==12)h+=12;
      if(ampm==='AM'&&h===12)h=0;
      return String(h).padStart(2,'0')+':'+mi;
    }
  }catch(e){}
  return val.substring(0,5);
}

async function salvarReuniaoNova(){
  var dia=(document.getElementById('r-dia')||{}).value||'';
  if(!dia){showToast('Informe o dia');return;}
  var slots=state.reuniaoSlots||[];
  slots.forEach(function(s,i){
    var ini=document.getElementById('slot-inicio-'+i);
    var fim=document.getElementById('slot-fim-'+i);
    if(ini) s.inicio=normalizeTime(ini.value);
    if(fim) s.fim=normalizeTime(fim.value);
  });
  var validos=slots.filter(function(s){return s.inicio;});
  if(!validos.length){showToast('Informe ao menos um horário');return;}
  showToast('Salvando '+validos.length+' slot(s)...');
  var erros=0;
  for(var i=0;i<validos.length;i++){
    var s=validos[i];
    var dataHora=dia+'T'+s.inicio;
    var dataFim=s.fim?dia+'T'+s.fim:'';
    var res=await apiPost({action:'salvarReuniao',dataHora:dataHora,dataFim:dataFim,consultor:'',cliente:'',status:'livre',obs:''});
    if(!res||!res.ok) erros++;
  }
  showToast(erros===0?'\u2713 '+validos.length+' slot(s) criado(s)!':'Criado com '+erros+' erro(s)');
  state.reuniaoModal=false;
  state.reuniaoSlots=[];
  state.reuniaoCarregada=false;
  render();
}

function donutSVG(fatias, tamanho){
  var total=fatias.reduce(function(s,f){return s+f.valor;},0);
  if(!total)return'<svg width="'+tamanho+'" height="'+tamanho+'" viewBox="0 0 '+tamanho+' '+tamanho+'"><circle cx="'+(tamanho/2)+'" cy="'+(tamanho/2)+'" r="'+(tamanho/2-6)+'" fill="none" stroke="var(--surface3)" stroke-width="10"/></svg>';
  var cx=tamanho/2,cy=tamanho/2,r=tamanho/2-6,strokeW=10;
  var circ=2*Math.PI*r;
  var offset=0;
  var paths=fatias.map(function(f){
    if(!f.valor)return'';
    var pct=f.valor/total;
    var dash=pct*circ;
    var paths2='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+f.cor+'" stroke-width="'+strokeW+'" stroke-dasharray="'+dash+' '+(circ-dash)+'" stroke-dashoffset="'+(-(offset/total)*circ)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    offset+=f.valor;
    return paths2;
  }).join('');
  return'<svg width="'+tamanho+'" height="'+tamanho+'" viewBox="0 0 '+tamanho+' '+tamanho+'">'+paths+'</svg>';
}

function renderAnaliseKPIs(atividades, registros, mesAno, vizTabsHTML){
  var consultores=['igor','felipe','paula','ramon'];
  var cards=atividades.map(function(atv){
    var donutsHTML=consultores.map(function(cons){
      var u=USUARIOS[cons];
      var clientes=(CLIENTES[cons]||[]).filter(function(cl){return escopoInclui(atv.escopo,cl.id);});
      if(!clientes.length)return'';
      var verde=0,amarelo=0,vermelho=0,cinza=0;
      clientes.forEach(function(cl){
        var reg=registros.find(function(r){return r.consultor===cons&&r.clienteId===cl.id&&r.atividadeId===atv.id;});
        if(!reg||!reg.codigo){cinza++;return;}
        var codObj=CODIGOS.find(function(c){return c.codigo===reg.codigo;});
        var nota=codObj?codObj.nota:0;
        if(nota>=10)verde++;else if(nota>=5)amarelo++;else vermelho++;
      });
      var total=clientes.length;
      var pct=total>0?Math.round(((verde+amarelo)/total)*100):0;
      var pctColor=pct>=80?'#4ade80':pct>=50?'#fbbf24':'#f87171';
      var fatias=[{valor:verde,cor:'#4ade80'},{valor:amarelo,cor:'#fbbf24'},{valor:vermelho,cor:'#f87171'},{valor:cinza,cor:'#374151'}];
      return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0">'
        +'<div style="position:relative;width:56px;height:56px">'
          +donutSVG(fatias,56)
          +'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--mono);color:'+pctColor+'">'+pct+'%</div>'
        +'</div>'
        +'<div style="font-size:10px;font-weight:600;color:'+u.cor+';font-family:var(--mono)">'+u.nome+'</div>'
        +'<div style="font-size:9px;color:var(--text3);font-family:var(--mono)">'+total+' cli.</div>'
        +'</div>';
    }).join('');
    if(!donutsHTML.replace(/\s/g,''))return'';
    return '<div style="background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px 16px">'
      +'<div style="font-size:12px;font-weight:600;margin-bottom:12px;line-height:1.3;color:var(--text)">'+atv.nome+'</div>'
      +'<div style="display:flex;gap:8px;justify-content:space-around">'+donutsHTML+'</div>'
      +'</div>';
  }).filter(Boolean).join('');

  if(!cards)cards=emptyState('&#128203;','Nenhuma atividade neste mês','Sincronize os dados ou adicione atividades.');

  var leg='<div style="background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:16px 20px;margin-bottom:20px">'
    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:12px">'
      +'<div><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="width:10px;height:10px;border-radius:50%;background:#4ade80;flex-shrink:0;display:inline-block"></span><span style="font-size:11px;font-weight:600;color:#4ade80;font-family:var(--mono)">Nota 10</span></div>'
        +'<div style="font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.7">Atividade finalizada<br>Não se aplica<br>Sem informação (IND)<br>Cliente não executou<br>Fora de timing<br>Sem resposta do cliente</div></div>'
      +'<div><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="width:10px;height:10px;border-radius:50%;background:#fbbf24;flex-shrink:0;display:inline-block"></span><span style="font-size:11px;font-weight:600;color:#fbbf24;font-family:var(--mono)">Nota 5</span></div>'
        +'<div style="font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.7">Realizado parcial<br>Planilha de cotação enviada</div></div>'
      +'<div><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="width:10px;height:10px;border-radius:50%;background:#f87171;flex-shrink:0;display:inline-block"></span><span style="font-size:11px;font-weight:600;color:#f87171;font-family:var(--mono)">Nota 0</span></div>'
        +'<div style="font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.7">Não realizado</div></div>'
      +'<div><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="width:10px;height:10px;border-radius:50%;background:#374151;flex-shrink:0;display:inline-block"></span><span style="font-size:11px;font-weight:600;color:#555a75;font-family:var(--mono)">Vazio</span></div>'
        +'<div style="font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.7">Consultor não preencheu</div></div>'
    +'</div>'
    +'<div style="border-top:1px solid var(--border);padding-top:10px">'
      +'<span style="font-size:10px;color:var(--text3);font-family:var(--mono)">% no centro = proporção de clientes com nota ≥ 5 (verde + amarelo)</span>'
    +'</div>'
    +'</div>';

  var kpiModalHTML=renderKpiModal();
  return '<div class="page page-fade">'
    +'<div class="page-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px">'
      +'<div><div class="page-title">Análise por Atividade</div><div class="page-sub">'+mesAno+' · KPIs</div></div>'
    +'</div>'
    +(vizTabsHTML||'')
    +leg
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">'+cards+'</div>'
    +'</div>'
    +kpiModalHTML;
}


function renderAnalisePage(){
  var mesAno=state.mesAtual;
  var registros=getRegistros().filter(function(r){return r.mesAno===mesAno;});
  var atividades=getAtividades().filter(function(a){return a.mesAno===mesAno&&a.ativo;});
  var filtroConsultor=state.analiseConsultorFiltro||'todos';
  var visualizacao=state.analiseVisualizacao||'lista';
  var aLista=visualizacao==='lista';
  var aKpis=!aLista;

  var btnStyle='padding:7px 18px;border-radius:20px;font-size:12px;font-family:var(--mono);cursor:pointer;';
  var vizTabsHTML='<div style="display:flex;gap:8px;margin-bottom:16px">'
    +'<button id="btn-viz-lista" style="'+btnStyle+'border:1px solid '+(aLista?'var(--accent)':'var(--border2)')+';background:'+(aLista?'var(--accent-light)':'transparent')+';color:'+(aLista?'var(--accent)':'var(--text2)')+'">&#128203; Lista</button>'
    +'<button id="btn-viz-kpis" style="'+btnStyle+'border:1px solid '+(aKpis?'var(--accent)':'var(--border2)')+';background:'+(aKpis?'var(--accent-light)':'transparent')+';color:'+(aKpis?'var(--accent)':'var(--text2)')+'">&#128202; KPIs</button>'
    +'</div>';

  if(aKpis) return renderAnaliseKPIs(atividades, registros, mesAno, vizTabsHTML);

  var consultores=['todos','igor','felipe','paula','ramon'];
  var filtroHTML='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">'
    +consultores.map(function(c){
      var label=c==='todos'?'Todos':USUARIOS[c]?USUARIOS[c].nome:c;
      var ativo=filtroConsultor===c;
      var s='padding:6px 14px;border-radius:20px;font-size:12px;font-family:var(--mono);cursor:pointer;border:1px solid ';
      return '<button id="filtro-'+c+'" style="'+s+(ativo?'var(--accent)':'var(--border2)')+';background:'+(ativo?'var(--accent-light)':'transparent')+';color:'+(ativo?'var(--accent)':'var(--text2)')+'">'+label+'</button>';
    }).join('')
    +'</div>';

  var clientesList=[];
  var consultoresAtv=filtroConsultor==='todos'?Object.keys(CLIENTES):[filtroConsultor];
  var atividadesHTML=atividades.map(function(atv){
    clientesList=[];
    consultoresAtv.forEach(function(cons){
      (CLIENTES[cons]||[]).forEach(function(cl){
        if(escopoInclui(atv.escopo,cl.id)){
          clientesList.push({consultor:cons,clienteId:cl.id,clienteNome:cl.nome});
        }
      });
    });

    var total=clientesList.length;
    if(!total)return'';

    var contagem={};
    var preenchidos=0;
    clientesList.forEach(function(cl){
      var reg=registros.find(function(r){
        return r.consultor===cl.consultor&&r.clienteId===cl.clienteId&&r.atividadeId===atv.id;
      });
      var cod=reg?reg.codigo:'';
      if(cod){
        preenchidos++;
        contagem[cod]=(contagem[cod]||0)+1;
      } else {
        contagem['__sem_preenchimento']=(contagem['__sem_preenchimento']||0)+1;
      }
    });

    var pctPreench=Math.round(preenchidos/total*100);
    var expandida=state.analiseAtividadeExpandida===atv.id;

    var barrasHTML=Object.keys(contagem).sort().map(function(cod){
      var qtd=contagem[cod];
      var pct=Math.round(qtd/total*100);
      var codObj=CODIGOS.find(function(c){return c.codigo===cod;});
      var label=cod==='__sem_preenchimento'?'Consultor não preencheu':codObj?codObj.descricao:cod;
      var codObjCor=CODIGOS.find(function(c){return c.codigo===cod;});
      var cor=cod==='__sem_preenchimento'?'#555a75'
        :!codObjCor?'#555a75'
        :codObjCor.nota>=10?'#4ade80'
        :codObjCor.nota>=5?'#fbbf24'
        :'#f87171';
      return '<div style="margin-bottom:8px">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">'
          +'<span style="font-size:11px;font-family:var(--mono);color:var(--text2)">'+label+'</span>'
          +'<span style="font-size:11px;font-family:var(--mono);color:'+cor+'">'+qtd+'x · '+pct+'%</span>'
        +'</div>'
        +'<div style="height:4px;background:var(--surface3);border-radius:2px">'
          +'<div style="width:'+pct+'%;height:100%;background:'+cor+';border-radius:2px"></div>'
        +'</div>'
        +'</div>';
    }).join('');

    var tabelaHTML='';
    if(expandida){
      var linhas=clientesList.map(function(cl){
        var reg=registros.find(function(r){
          return r.consultor===cl.consultor&&r.clienteId===cl.clienteId&&r.atividadeId===atv.id;
        });
        var cod=reg?reg.codigo:'';
        var codObj=CODIGOS.find(function(c){return c.codigo===cod;});
        var label=!cod?'Consultor não preencheu':codObj?codObj.descricao:cod;
        var cor=!cod?'#555a75'
          :cod==='0'?'#f87171'
          :cod==='5-'||cod==='Enviado para cotação'?'#fbbf24'
          :cod==='Sem Resposta'?'#60a5fa'
          :'#4ade80';
        var u=USUARIOS[cl.consultor]||{nome:cl.consultor,cor:'#8b90a8',corBg:'rgba(139,144,168,.1)'};
        return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">'
          +'<div style="width:22px;height:22px;border-radius:50%;background:'+u.corBg+';color:'+u.cor+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0">'+u.nome[0]+'</div>'
          +'<div style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+cl.clienteNome+'</div>'
          +'<div style="font-size:11px;font-family:var(--mono);color:'+cor+';text-align:right;min-width:80px">'+label+'</div>'
          +'</div>';
      }).join('');
      tabelaHTML='<div style="margin-top:12px;border-top:1px solid var(--border2);padding-top:12px">'+linhas+'</div>';
    }

    return '<div style="background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px 16px;'+(expandida?'grid-column:1/-1;':'height:280px;')+'display:flex;flex-direction:column;overflow:'+(expandida?'auto':'hidden')+'" id="atv-'+atv.id+'">'
      +'<div style="cursor:pointer;display:flex;flex-direction:column;flex:1;overflow:hidden" id="atv-hdr-'+atv.id+'">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
          +'<div style="font-size:13px;font-weight:600;flex:1;padding-right:12px;line-height:1.3">'+atv.nome+'</div>'
          +'<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'
            +'<span style="font-size:13px;font-family:var(--mono);color:'+(pctPreench>=90?'#4ade80':pctPreench>=60?'#fbbf24':'#f87171')+'">'+pctPreench+'%</span>'
            +'<span style="font-size:16px;color:var(--text3)">'+(expandida?'▲':'▼')+'</span>'
          +'</div>'
        +'</div>'
        +'<div style="overflow-y:auto;flex:1;margin-top:8px">'+barrasHTML+'</div>'
      +'</div>'
      +tabelaHTML
      +'</div>';
  }).join('');

  if(!atividadesHTML) atividadesHTML=emptyState('&#128203;','Nenhuma atividade neste mês','Sincronize os dados ou adicione atividades.');

  return '<div class="page page-fade">'
    +'<div class="page-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px">'
      +'<div><div class="page-title">Análise por Atividade</div><div class="page-sub">'+mesAno+'</div></div>'
    +'</div>'
    +vizTabsHTML
    +filtroHTML
    +'<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start;max-width:none">'
    +atividadesHTML
    +'</div>'
    +'</div>';
}

var TIPOS_DEMANDA=['Entrega de Safra','Recomendações Safra','Recomendações Inverno','Recomendações Foliares','Ajustes Pontuais','Demanda Extra'];

async function carregarPrioridades(){
  var res=await apiCall({action:'getPrioridades'});
  if(res&&!res.erro&&Array.isArray(res)){state.prioridades=res;setStore('prioridades',res);}
  else{state.prioridades=getStore('prioridades',[]);}
  state.prioridadesCarregadas=true;render();
}

function prioridadeCor(p){return p==='alta'?'#f87171':p==='media'?'#fbbf24':'#4ade80';}
function prioridadeBg(p){return p==='alta'?'rgba(248,113,113,.12)':p==='media'?'rgba(251,191,36,.12)':'rgba(74,222,128,.12)';}
function prioridadeLabel(p){return p==='alta'?'Alta':p==='media'?'Média':'Baixa';}
function statusPrioLabel(s){return s==='marcado'?'Marcado':'Pendente de Agenda';}
function statusPrioCls(s){return s==='marcado'?'badge-ok':'badge-warn';}

function renderPrioridadesPage(){
  if(!state.prioridadesCarregadas){
    carregarPrioridades();
    return '<div class="page"><div style="text-align:center;padding:60px;color:var(--text3);font-family:var(--mono);font-size:13px">Carregando prioridades...</div></div>';
  }
  var ordem={alta:0,media:1,baixa:2};
  var filtro=state.prioFiltro||'todos';
  var lista=state.prioridades.slice()
    .filter(function(p){return filtro==='todos'||p.prioridade===filtro;})
    .sort(function(a,b){
      var po=(ordem[a.prioridade]||2)-(ordem[b.prioridade]||2);
      if(po!==0)return po;
      if(a.status==='pendente'&&b.status!=='pendente')return-1;
      if(b.status==='pendente'&&a.status!=='pendente')return 1;
      return 0;
    });

  var filtroHTML='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">'
    +['todos','alta','media','baixa'].map(function(f){
      var ativo=filtro===f;
      var label=f==='todos'?'Todos':f==='alta'?'🔴 Alta':f==='media'?'🟡 Média':'🟢 Baixa';
      var cor=f==='alta'?'#f87171':f==='media'?'#fbbf24':f==='baixa'?'#4ade80':'var(--accent)';
      return '<button id="prio-filtro-'+f+'" style="padding:6px 14px;border-radius:20px;font-size:12px;font-family:var(--mono);cursor:pointer;border:1px solid '+(ativo?cor:'var(--border2)')+';background:'+(ativo?'rgba(0,0,0,.15)':'transparent')+';color:'+(ativo?cor:'var(--text2)')+'">'+label+'</button>';
    }).join('')
    +'</div>';

  var cards=lista.map(function(p){
    var u=USUARIOS[p.consultor]||{nome:p.consultor||'\u2014',cor:'#8b90a8',corBg:'rgba(139,144,168,.1)'};
    var cor=prioridadeCor(p.prioridade);
    var bg=prioridadeBg(p.prioridade);
    var reuniaoInfo='';
    if(p.status==='marcado'&&p.reuniaoId){
      var reu=state.reunioes.find(function(r){return r.id===p.reuniaoId;});
      if(reu){
        var hi=reu.dataHora&&reu.dataHora.length>=16?reu.dataHora.substring(11,16):'';
        var hf=reu.dataFim&&reu.dataFim.length>=16?reu.dataFim.substring(11,16):'';
        var dia=reu.dataHora?reu.dataHora.substring(0,10):'';
        var dFmt='';
        try{var dd=new Date(dia+'T00:00:00');dFmt=String(dd.getDate()).padStart(2,'0')+'/'+String(dd.getMonth()+1).padStart(2,'0');}catch(e){dFmt=dia;}
        reuniaoInfo='<div style="font-size:11px;font-family:var(--mono);color:#60a5fa;margin-top:4px">\uD83D\uDCC5 '+dFmt+' '+hi+(hf?' \u2013 '+hf:'')+'</div>';
      }
    }
    return '<div style="background:var(--surface2);border:1px solid var(--border2);border-left:3px solid '+cor+';border-radius:10px;padding:14px 16px;margin-bottom:10px">'
      +'<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap">'
        +'<div style="flex:1;min-width:0">'
          +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">'
            +'<span style="font-size:11px;font-weight:700;font-family:var(--mono);padding:2px 8px;border-radius:4px;background:'+bg+';color:'+cor+'">'+prioridadeLabel(p.prioridade).toUpperCase()+'</span>'
            +'<span class="badge '+statusPrioCls(p.status)+'">'+statusPrioLabel(p.status)+'</span>'
            +'<span style="font-size:12px;font-family:var(--mono);color:var(--text3)">'+p.tipo+'</span>'
          +'</div>'
          +'<div style="font-size:15px;font-weight:600;margin-bottom:4px">'+p.cliente+'</div>'
          +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:'+(p.descricao?'6px':'0')+'">'
            +'<div style="width:22px;height:22px;border-radius:50%;background:'+u.corBg+';color:'+u.cor+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600">'+u.nome[0]+'</div>'
            +'<span style="font-size:12px;color:var(--text2)">'+u.nome+'</span>'
          +'</div>'
          +(p.descricao?'<div style="font-size:12px;color:var(--text3);font-family:var(--mono)">'+p.descricao+'</div>':'')
          +reuniaoInfo
        +'</div>'
        +'<div style="display:flex;gap:6px;flex-shrink:0">'
          +'<button onclick="abrirModalPrioridade(\''+p.id+'\')" style="padding:6px 12px;background:transparent;border:1px solid var(--border2);border-radius:7px;font-size:11px;color:var(--text2);cursor:pointer">Editar</button>'
          +'<button onclick="deletarPrioridade(\''+p.id+'\')" style="padding:6px 10px;background:transparent;border:1px solid rgba(248,113,113,.3);border-radius:7px;font-size:11px;color:#f87171;cursor:pointer">\u2715</button>'
        +'</div>'
      +'</div>'
      +'</div>';
  }).join('');
  if(!cards)cards=emptyState('\uD83C\uDFAF','Nenhuma prioridade cadastrada','Adicione demandas para acompanhar aqui.');

  var modalHTML='';
  if(state.prioridadeModal){

function setStatusPrio(status){
  state.prioridadeModalData.status=status;
  if(status!=='marcado')state.prioridadeModalData.reuniaoId='';
  state.prioridadeReunioPopup=false;
  render();
}

function selecionarReuniao(id){
  state.prioridadeModalData.reuniaoId=id;
  state.prioridadeReunioPopup=false;
  render();
}

function abrirModalPrioridade(id){
  var data={status:'pendente',prioridade:'media'};
  if(id){var p=state.prioridades.find(function(x){return x.id===id;});if(p)data=Object.assign({},p);}
  if(!state.reuniaoCarregada)carregarReunioes();
  state.prioridadeModal=true;
  state.prioridadeReunioPopup=false;
  state.prioridadeModalData=data;
  render();
}

async function salvarPrioridade(){
  var d=state.prioridadeModalData;
  var cliente=(document.getElementById('pr-cliente')||{}).value||'';
  var consultor=(document.getElementById('pr-consultor')||{}).value||'';
  var tipo=(document.getElementById('pr-tipo')||{}).value||'';
  var prioridade=(document.getElementById('pr-prioridade')||{}).value||'media';
  var descricao=(document.getElementById('pr-descricao')||{}).value||'';
  var status=d.status||'pendente';
  var reuniaoId=d.reuniaoId||'';
  if(!cliente){showToast('Informe o cliente');return;}
  if(!consultor){showToast('Informe o consultor');return;}
  var payload={action:'salvarPrioridade',cliente:cliente,consultor:consultor,tipo:tipo,
    prioridade:prioridade,status:status,descricao:descricao,reuniaoId:reuniaoId,criadoPor:state.usuario};
  if(d.id)payload.id=d.id;
  showToast('Salvando...');
  var res=await apiPost(payload);
  if(res&&res.ok){
    showToast('\u2713 Demanda salva!');
    state.prioridadeModal=false;
    state.prioridadeReunioPopup=false;
    state.prioridadesCarregadas=false;
    render();
  } else {showToast('Erro ao salvar');}
}

async function deletarPrioridade(id){
  if(!confirm('Remover esta demanda?'))return;
  showToast('Removendo...');
  var res=await apiPost({action:'deletarPrioridade',id:id});
  if(res&&res.ok){showToast('\u2713 Removido!');state.prioridadesCarregadas=false;render();}
  else{showToast('Erro ao remover');}
}

var CONSULTORES_PLAN = ['gestor','igor','felipe','paula','ramon'];

function semanaISO(date){
  var d = new Date(date||Date.now());
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()+4-(d.getDay()||7));
  var yearStart = new Date(d.getFullYear(),0,1);
  return d.getFullYear()+'-S'+String(Math.ceil((((d-yearStart)/86400000)+1)/7)).padStart(2,'0');
}

function semanasDoMes(mesAno){
  var parts=mesAno.split('-');
  var ano=parseInt(parts[0]),mes=parseInt(parts[1])-1;
  var semanas=[], seen={};
  var dias=new Date(ano,mes+1,0).getDate();
  for(var d=1;d<=dias;d++){
    var s=semanaISO(new Date(ano,mes,d));
    if(!seen[s]){seen[s]=true;semanas.push(s);}
  }
  return semanas;
}

    +'<div class="page-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px">'

      +'<div style="display:flex;gap:8px">'
        +'<button class="btn-sec" onclick="state.planejamentoCarregado=false;render()">\u27f3 Atualizar</button>'
        +'<button class="btn-save" id="btn-nova-tarefa">+ Nova Tarefa</button>'

function prioLabel(p){return p==='alta'?'Alta':p==='media'?'M\u00e9dia':'Baixa';}

function initPlanejamentoDnd(){
  var cols=['aberto','em_andamento','feito'];
  cols.forEach(function(st){
    var el=document.querySelector('.kanban-col-body.plan-col-'+st);
    if(!el||el._sortable)return;
    el._sortable=Sortable.create(el,{
      group:'planejamento',
      animation:150,
      ghostClass:'sortable-ghost',
      dragClass:'sortable-drag',
      onAdd:function(evt){evt.to.classList.remove('sortable-over');},
      onRemove:function(evt){evt.from.classList.remove('sortable-over');},
      onMove:function(evt){evt.to.classList.add('sortable-over');evt.from.classList.remove('sortable-over');},
      onEnd:function(evt){
        var id=evt.item.dataset.planId;
        var novoStatus=evt.to.dataset.planStatus;
        if(!id||!novoStatus)return;
        var idx=state.planejamento.findIndex(function(p){return p.id===id;});
        if(idx<0)return;
        if(state.planejamento[idx].status===novoStatus){render();return;}
        state.planejamento[idx].status=novoStatus;
        setStore('planejamento',state.planejamento);
        apiPost({action:'salvarPlanejamento',id:id,titulo:state.planejamento[idx].titulo,descricao:state.planejamento[idx].descricao,consultor:state.planejamento[idx].consultor,criadoPor:state.planejamento[idx].criadoPor,mesAno:state.planejamento[idx].mesAno,semana:state.planejamento[idx].semana||'',status:novoStatus,prioridade:state.planejamento[idx].prioridade,dataEntrega:state.planejamento[idx].dataEntrega});
        showToast('✓ Status: '+statusLabel(novoStatus));
        render();
      }
    });
  });
}

function bindPlanejamento(){
  // Tabs
  CONSULTORES_PLAN.forEach(function(c){
    var btn=document.getElementById('plan-tab-'+c);
    if(btn)btn.onclick=function(){state.planejamentoAba=c;render();};
  });

  // Nova tarefa
  var btnNova=document.getElementById('btn-nova-tarefa');
  if(btnNova)btnNova.onclick=function(){state.planejamentoModal=true;state.planejamentoModalData={};render();};
  // Salvar
  var btnSalvar=document.getElementById('btn-salvar-plan');
  if(btnSalvar)btnSalvar.onclick=salvarPlanejamentoCard;
  document.querySelectorAll('.pl-cons-btn').forEach(function(btn){
    btn.onclick=function(){
      var c=this.dataset.cons;
      var u=USUARIOS[c]||{cor:'#8b90a8'};
      if(!state.planejamentoModalData.consultoresSel)state.planejamentoModalData.consultoresSel=[];
      var idx=state.planejamentoModalData.consultoresSel.indexOf(c);
      if(idx>=0){
        state.planejamentoModalData.consultoresSel.splice(idx,1);
        this.classList.remove('selected');
        this.style.borderColor='var(--border2)';
        this.style.background='transparent';
        this.style.color='var(--text2)';
      } else {
        state.planejamentoModalData.consultoresSel.push(c);
        this.classList.add('selected');
        this.style.borderColor=u.cor;
        this.style.background='rgba(0,0,0,.2)';
        this.style.color=u.cor;
      }
      // NO chama render() para no apagar o que o usurio digitou
    };
  });
  // Init drag and drop
  setTimeout(initPlanejamentoDnd, 50);
  // Cards - mover status ao clicar
  (state.planejamento||[]).filter(function(p){return p.consultor===state.planejamentoAba;}).forEach(function(p){
    var card=document.getElementById('plan-card-'+p.id);
    // drag only - no click to advance
    var del=document.getElementById('plan-del-'+p.id);
    if(del)del.onclick=function(e){e.stopPropagation();deletarPlanCard(p.id);};
    var edit=document.getElementById('plan-edit-'+p.id);
    if(edit)(function(pp){edit.onclick=function(e){e.stopPropagation();state.planejamentoModal=true;state.planejamentoModalData={id:pp.id,titulo:pp.titulo,descricao:pp.descricao,prioridade:pp.prioridade,dataEntrega:pp.dataEntrega,consultor:pp.consultor,criadoPor:pp.criadoPor,mesAno:pp.mesAno,semana:pp.semana||'',status:pp.status,consultoresSel:[pp.consultor]};render();};})(p);
  });
}

async function salvarPlanejamentoCard(){
  if(window._salvandoPlan)return;
  window._salvandoPlan=true;
  var titulo=(document.getElementById('pl-titulo')||{}).value||'';
  if(!titulo){window._salvandoPlan=false;showToast('Informe o título');return;}
  var descricao=(document.getElementById('pl-desc')||{}).value||'';
  var prioridade=(document.getElementById('pl-prioridade')||{}).value||'media';
  var dataEntrega=(document.getElementById('pl-data')||{}).value||'';

  // Pega dados do modal
  var d2=state.planejamentoModalData||{};
  var isEdit2=!!d2.id;
  var consultoresSel=(d2.consultoresSel&&d2.consultoresSel.length)?d2.consultoresSel:[isEdit2?d2.consultor:(state.planejamentoAba||'gestor')];

  var payload={action:'salvarPlanejamento',
    titulo:titulo,descricao:descricao,
    consultor:consultoresSel[0],
    criadoPor:isEdit2?d2.criadoPor:state.usuario,
    mesAno:isEdit2?d2.mesAno:state.mesAtual,
    semana:isEdit2?(d2.semana||''):(state.planejamentoSemana||''),
    status:isEdit2?d2.status:'aberto',
    prioridade:prioridade,dataEntrega:dataEntrega};
  if(isEdit2)payload.id=d2.id;

  showToast('Salvando...');
  var res=await apiPost(payload);
  if(res&&res.ok){
    showToast(isEdit2?'✓ Tarefa atualizada!':'✓ Tarefa(s) criada(s)!');
    state.planejamentoModal=false;
    if(isEdit2){
      var idx2=state.planejamento.findIndex(function(p){return p.id===d2.id;});
      if(idx2>=0){
        state.planejamento[idx2].titulo=titulo;
        state.planejamento[idx2].descricao=descricao;
        state.planejamento[idx2].prioridade=prioridade;
        state.planejamento[idx2].dataEntrega=dataEntrega;
      }
      // Adicionar novos consultores que no tinham card
      var novosConss=consultoresSel.filter(function(c){return c!==d2.consultor;});
      novosConss.forEach(function(cons){
        state.planejamento.push({
          id:'pl'+Date.now()+cons,titulo:titulo,descricao:descricao,consultor:cons,
          criadoPor:state.usuario,mesAno:d2.mesAno,semana:d2.semana||'',
          status:'aberto',prioridade:prioridade,dataEntrega:dataEntrega,
          criadoEm:new Date().toISOString()
        });
        apiPost({action:'salvarPlanejamento',titulo:titulo,descricao:descricao,
          consultor:cons,criadoPor:state.usuario,mesAno:d2.mesAno,
          semana:d2.semana||'',status:'aberto',prioridade:prioridade,dataEntrega:dataEntrega});
      });
    } else {
      consultoresSel.forEach(function(cons,ci){
        state.planejamento.push({
          id:ci===0?(res.id||('pl'+Date.now())):('pl'+Date.now()+ci),
          titulo:titulo,descricao:descricao,consultor:cons,
          criadoPor:state.usuario,mesAno:state.mesAtual,
          semana:state.planejamentoSemana||'',status:'aberto',
          prioridade:prioridade,dataEntrega:dataEntrega,
          criadoEm:new Date().toISOString()
        });
      });
      for(var ci2=1;ci2<consultoresSel.length;ci2++){
        apiPost({action:'salvarPlanejamento',titulo:titulo,descricao:descricao,
          consultor:consultoresSel[ci2],criadoPor:state.usuario,
          mesAno:state.mesAtual,semana:state.planejamentoSemana||'',
          status:'aberto',prioridade:prioridade,dataEntrega:dataEntrega});
      }
    }
    setStore('planejamento',state.planejamento);
    render();
  } else {showToast('Erro ao salvar');}
  window._salvandoPlan=false;
}

async function moverPlanCard(id){
  var cols=['aberto','em_andamento','feito'];
  var idx=state.planejamento.findIndex(function(p){return p.id===id;});
  if(idx<0)return;
  var cur=state.planejamento[idx].status;
  var next=cols[(cols.indexOf(cur)+1)%cols.length];
  state.planejamento[idx].status=next;
  setStore('planejamento',state.planejamento);
  apiPost({action:'salvarPlanejamento',id:id,titulo:state.planejamento[idx].titulo,descricao:state.planejamento[idx].descricao,consultor:state.planejamento[idx].consultor,criadoPor:state.planejamento[idx].criadoPor,mesAno:state.planejamento[idx].mesAno,semana:state.planejamento[idx].semana,status:next,prioridade:state.planejamento[idx].prioridade,dataEntrega:state.planejamento[idx].dataEntrega});
  render();
}

async function deletarPlanCard(id){
  var card=state.planejamento.find(function(p){return p.id===id;});
  if(!card)return;
  var irmaos=state.planejamento.filter(function(p){
    return p.id!==id&&p.titulo===card.titulo&&p.descricao===card.descricao&&p.mesAno===card.mesAno&&p.criadoPor===card.criadoPor;
  });
  var deletarTodos=false;
  if(irmaos.length>0){
    var nomes=irmaos.map(function(p){var u=USUARIOS[p.consultor];return u?u.nome:p.consultor;}).join(', ');
    deletarTodos=confirm('Esta tarefa foi compartilhada com '+nomes+'.\n\nOK = Excluir para TODOS\nCancelar = Excluir so daqui');
  } else {
    if(!confirm('Remover esta tarefa?'))return;
  }
  showToast('Removendo...');
  var res=await apiPost({action:'deletarPlanejamento',id:id});
  if(res&&res.ok){
    state.planejamento=state.planejamento.filter(function(p){return p.id!==id;});
    if(deletarTodos&&irmaos.length>0){
      for(var i=0;i<irmaos.length;i++){
        await apiPost({action:'deletarPlanejamento',id:irmaos[i].id});
      }
      var idsRemover=irmaos.map(function(p){return p.id;});
      state.planejamento=state.planejamento.filter(function(p){return idsRemover.indexOf(p.id)<0;});
    }
    setStore('planejamento',state.planejamento);
    showToast('✓ Removido!');
    render();
  } else {showToast('Erro ao remover');}
}

function renderAtivExpandida(consultor,clienteId,mesAno){

function renderLucasPage(){
  var m=state.mesAtual;
  var cards=getCards().filter(function(c){return c.mesAno===m&&String(c.destinatario||'lucas').toLowerCase()!=='jean';});
  var eu=state.usuario;

  // Filtros
  var filtroStatus=state.lucasFiltroStatus||'todos';
  var filtroConsultor=state.lucasFiltroConsultor||'todos';

  var filtrados=cards.filter(function(c){
    if(filtroStatus!=='todos'&&c.status!==filtroStatus)return false;
    if(filtroConsultor!=='todos'&&c.criadoPor!==filtroConsultor)return false;
    return true;
  });

  // KPIs
  var abertos=cards.filter(function(c){return c.status==='aberto';}).length;
  var emAnd=cards.filter(function(c){return c.status==='em_andamento';}).length;
  var feitos=cards.filter(function(c){return c.status==='feito';}).length;
  var notaLucas=calcNotaLucas(m);

  // Tabs status
  var statusTabs=[['todos','Todos',cards.length],['aberto','Aberto',abertos],['em_andamento','Em andamento',emAnd],['feito','Feito',feitos]];
  var statusTabsHTML=statusTabs.map(function(t){
    return'<button class="filtro-tab'+(filtroStatus===t[0]?' active':'')+'" onclick="state.lucasFiltroStatus=\''+t[0]+'\';render()">'+t[1]+' ('+t[2]+')</button>';
  }).join('');

  // Tabs consultor
  var consultores=['todos','igor','felipe','paula','ramon','gestor'];
  var consTabsHTML=consultores.map(function(c){
    var lbl=c==='todos'?'Todos':USUARIOS[c]?USUARIOS[c].nome:c;
    var cnt=c==='todos'?cards.length:cards.filter(function(x){return x.criadoPor===c;}).length;
    return'<button class="filtro-tab'+(filtroConsultor===c?' active':'')+'" onclick="state.lucasFiltroConsultor=\''+c+'\';render()">'+lbl+' ('+cnt+')</button>';
  }).join('');

  // Kanban por status
  var cols=['aberto','em_andamento','feito'];

function renderCardDetalhe(cardId){
  var card=getCards().find(function(c){return c.id===cardId;});
  if(!card)return'';
  var eu=state.usuario;
  var isLucas=state.role==='lucas';
  var canEdit=(state.role==='gestor'||state.role==='diretor'||state.role==='consultor'||card.criadoPor===eu||isLucas||state.role==='jean');
  var canEditNota=(state.role==='gestor'||state.role==='diretor'||state.role==='consultor');
  var canMoveStatus=isLucas||state.role==='gestor'||state.role==='diretor'||state.role==='jean';
  var u=USUARIOS[card.criadoPor]||{cor:'#8b90a8',corBg:'var(--surface2)',nome:card.criadoPor};

  // Botes status
  var statusBtns=['aberto','em_andamento','feito'].map(function(s){
    var disabled=!canMoveStatus;
    return'<button class="status-btn '+s+(card.status===s?' active':'')+'"'
      +(disabled?' disabled style="opacity:.4;cursor:not-allowed"':' onclick="moverStatusCard(\''+cardId+'\',\''+s+'\')"')+'>'
      +statusLabel(s)+'</button>';
  }).join('');

  // Notas 1-10
  var notaBtns='';
  if(canEditNota){
    notaBtns='<div class="nota-input-wrap">';
    for(var i=1;i<=10;i++){
      var isActive=card.nota!==null&&card.nota!==''&&Number(card.nota)===i;
      notaBtns+='<button class="nota-btn'+(isActive?' active':'')+'" onclick="atribuirNota(\''+cardId+'\','+i+')">'+i+'</button>';
    }
    notaBtns+='</div>';
  }else{
    notaBtns=card.nota?'<span style="font-size:18px;font-weight:600;color:'+notaColor(Number(card.nota)*10)+'">'+card.nota+'/10</span>':'<span style="color:var(--text3);font-size:13px">Aguardando avaliação</span>';
  }

  // Anexos da memria local
  var anexos=state.lucasCardAnexos[cardId]||[];
  var anexosHTML=anexos.length?anexos.map(function(a,i){
    return'<div class="anexo-item">'
      +'<span class="anexo-icon">'+fileIcon(a.tipo)+'</span>'
      +'<span class="anexo-nome">'+a.nome+'</span>'
      +'<span class="anexo-size">'+fmtBytes(a.tamanho)+'</span>'
      +(a.driveUrl&&a.driveUrl!=='null'?'<a href="'+a.driveUrl+'" target="_blank" class="anexo-link">↗ abrir</a>':'<span style="font-size:10px;font-family:var(--mono);color:var(--warn)">pendente</span>')
      +(canEdit?'<button onclick="removerAnexo(\''+cardId+'\','+i+')" style="padding:2px 8px;border:1px solid var(--border2);border-radius:5px;background:transparent;color:var(--danger);font-size:10px;cursor:pointer;">✕</button>':'')
      +'</div>';
  }).join(''):'<div style="font-size:12px;font-family:var(--mono);color:var(--text3);padding:8px 0">Nenhum anexo</div>';

  // Upload area (s quem pode editar)
  var uploadHTML='';
  if(canEdit){
    // Arquivos da fila (antes de salvar)
    var fila=state.lucasUploadQueue||[];
    var filaHTML=fila.length?'<div style="margin-top:8px">'
      +fila.map(function(f,i){
        return'<div class="anexo-item"><span class="anexo-icon">'+fileIcon(f.type)+'</span>'
          +'<span class="anexo-nome">'+f.name+'</span>'
          +'<span class="anexo-size">'+fmtBytes(f.size)+'</span>'
          +'<span style="font-size:10px;font-family:var(--mono);color:var(--warn)">na fila</span>'
          +'<button onclick="removerDaFila('+i+')" style="padding:2px 8px;border:1px solid var(--border2);border-radius:5px;background:transparent;color:var(--danger);font-size:10px;cursor:pointer;">✕</button>'
          +'</div>';
      }).join('')+'</div>':'';
    uploadHTML='<div class="upload-area" id="upload-area-drop" onclick="document.getElementById(\'file-input-card\').click()" ondragover="event.preventDefault();this.classList.add(\'drag\')" ondragleave="this.classList.remove(\'drag\')" ondrop="handleFileDrop(event)">'
      +'<input type="file" id="file-input-card" multiple accept=".xlsx,.xls,.doc,.docx,.ppt,.pptx,.pdf,.csv,.txt,.zip,.rar,.png,.jpg,.jpeg" onchange="handleFileSelect(this)">'
      +'<div class="upload-area-text">📎 Clique ou arraste arquivos aqui<br><span style="font-size:10px;color:var(--text3)">Excel, Word, PowerPoint, PDF, imagens e mais</span></div>'
      +'</div>'
      +filaHTML
      +(fila.length?'<button class="btn-lucas" style="margin-top:10px;width:100%" onclick="enviarAnexosFila(\''+cardId+'\')">↑ Enviar '+fila.length+' arquivo(s) para o Drive</button>':'');
  }

  // Feedback
  var feedbackHTML='';
  if(canEditNota){
    feedbackHTML='<textarea id="feedback-input" rows="3" placeholder="Adicionar feedback..." style="width:100%;padding:10px;border:1px solid var(--border2);border-radius:8px;font-family:var(--sans);font-size:13px;background:var(--surface2);color:var(--text);resize:vertical;margin-top:8px;outline:none;">'+( card.feedback||'')+'</textarea>'
      +'<button class="btn-lucas" style="margin-top:8px" onclick="salvarFeedback(\''+cardId+'\')">Salvar Feedback</button>';
  }else{
    feedbackHTML=card.feedback?'<div style="font-size:13px;color:var(--text2);padding:10px;background:var(--surface2);border-radius:8px;border-left:3px solid var(--lucas)">'+card.feedback+'</div>'
      :'<div style="font-size:12px;font-family:var(--mono);color:var(--text3)">Sem feedback ainda</div>';
  }

  var prioDetalhe=card.prioridade?'<span class="prioridade-badge '+prioridadeCls(card.prioridade)+'" style="font-size:11px;padding:3px 10px;">'+prioridadeLabel(card.prioridade)+'</span>':'';
  var prazoDetalhe=prazoHTML(card.dataEntrega,card.status,card.dataConclusao);
  var dataEntregaStr=card.dataEntrega&&card.dataEntrega!=='null'&&card.dataEntrega?'Entrega: '+card.dataEntrega:'';
  // Transfer button
  var canTransfer=(state.role==='lucas'||state.role==='jean'||card.criadoPor===state.usuario);
  var destAtual=String(card.destinatario||'lucas').toLowerCase();
  var destNovo=destAtual==='jean'?'lucas':'jean';
  var destNovoLabel=destAtual==='jean'?'Lucas':'Jean';
  var transferBtn=canTransfer
    ?'<div class="card-detalhe-section"><div class="card-detalhe-section-label">DESTINATÁRIO</div><div style="display:flex;align-items:center;gap:10px;margin-top:4px"><span style="font-size:13px;color:var(--text2)">Atual: <strong style="color:'+(destAtual==='jean'?'#a78bfa':'#f472b6')+'">'+destAtual.charAt(0).toUpperCase()+destAtual.slice(1)+'</strong></span><button onclick="transferirCard(\''+cardId+'\',\''+destNovo+'\')" style="padding:6px 14px;background:transparent;border:1px solid var(--border2);border-radius:8px;font-size:12px;color:var(--text2);cursor:pointer">→ Transferir para '+destNovoLabel+'</button></div></div>'
    :'';

  return'<div class="card-detalhe">'
    +'<div class="card-detalhe-header">'
    +'<div style="flex:1">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">'+prioDetalhe+prazoDetalhe+'</div>'
    +'<div class="card-detalhe-title">'+card.titulo+'</div>'
    +'<div class="card-detalhe-meta">'+card.clienteNome+' · criado por <span style="color:'+u.cor+'">'+u.nome+'</span> · '+(card.criadoEm||'').substring(0,10)+(dataEntregaStr?' · <span style="color:var(--text2)">'+dataEntregaStr+'</span>':'')+'</div></div>'
    +'<div style="display:flex;gap:8px;align-items:flex-start">'
    +(canEdit&&!isLucas?'<button onclick="abrirModalEditarCard(\''+cardId+'\')" style="padding:6px 14px;border:1px solid var(--border2);border-radius:8px;background:transparent;color:var(--text2);font-family:var(--sans);font-size:12px;cursor:pointer;">✎ Editar</button>':'')
    +(state.role==='gestor'||card.criadoPor===eu?'<button onclick="deletarCard(\''+cardId+'\')" style="padding:6px 14px;border:1px solid var(--border2);border-radius:8px;background:transparent;color:var(--danger);font-family:var(--sans);font-size:12px;cursor:pointer;">✕</button>':'')
    +'<button onclick="state.lucasCardAberto=null;render()" style="padding:6px 14px;border:1px solid var(--border2);border-radius:8px;background:transparent;color:var(--text2);font-family:var(--sans);font-size:12px;cursor:pointer;">↑ Fechar</button>'
    +'</div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">'
    +'<div>'
    +'<div class="card-detalhe-section"><div class="card-detalhe-section-label">DESCRIÇÃO</div>'
    +'<div style="font-size:13px;color:var(--text2);line-height:1.6">'+( card.descricao||'—')+'</div></div>'

    +'<div class="card-detalhe-section"><div class="card-detalhe-section-label">STATUS</div>'
    +'<div class="status-btns">'+statusBtns+'</div></div>'

    +'<div class="card-detalhe-section"><div class="card-detalhe-section-label">NOTA (LUCAS)</div>'
    +notaBtns+'</div>'

    +'<div class="card-detalhe-section"><div class="card-detalhe-section-label">FEEDBACK</div>'
    +feedbackHTML+'</div>'
    +transferBtn
    +'</div>'

    +'<div>'
    +'<div class="card-detalhe-section"><div class="card-detalhe-section-label">PASTA NO DRIVE</div>'
    +(card.folderUrl&&card.folderUrl!=='null'&&card.folderUrl
      ?'<a href="'+card.folderUrl+'" target="_blank" class="anexo-link" style="font-size:13px">📁 Abrir pasta no Drive ↗</a>'
      :'<span style="font-size:12px;font-family:var(--mono);color:var(--text3)">Criando...</span>')+'</div>'

    +'<div class="card-detalhe-section"><div class="card-detalhe-section-label">ANEXOS</div>'
    +'<div class="anexos-list">'+anexosHTML+'</div>'

    +'</div></div></div>';

function abrirCardDetalhe(cardId){
  state.lucasCardAberto=cardId;
  // Carrega anexos do Sheets
  if(!state.lucasCardAnexos[cardId]){
    state.lucasCardAnexos[cardId]=[];
    if(APPS_SCRIPT_URL){
      apiCall({action:'getAnexos',cardId:cardId}).then(function(res){
        if(res&&Array.isArray(res)){state.lucasCardAnexos[cardId]=res;render();}
      });
    }
  }
  state.lucasUploadQueue=[];
  render();
}

function abrirModalNovoCard(){
  state.lucasModal=true;
  state.lucasModalData={titulo:'',descricao:'',clienteId:'geral',clienteNome:'Geral'};
  render();

  document.getElementById('root').insertAdjacentHTML('beforeend',renderModalNovoCard());

function renderModalNovoCard(){
  var eu=state.usuario;
  var clientes=[{id:'geral',nome:'Geral (sem cliente específico)'}].concat(
    eu==='gestor'?TODOS_CLIENTES_FLAT:(CLIENTES[eu]||[]).map(function(c){return Object.assign({},c);})
  );
  var opts=clientes.map(function(c){return'<option value="'+c.id+'">'+c.nome+'</option>';}).join('');
  return'<div class="modal-overlay" id="modal-novo-card">'
    +'<div class="modal-box">'
    +'<div class="modal-title" style="color:var(--lucas)">Nova Demanda para Lucas</div>'
    +'<div class="modal-field"><label>TÍTULO *</label><input type="text" id="nc-titulo" placeholder="Descreva a demanda..."></div>'
    +'<div class="modal-field"><label>DESCRIÇÃO</label><textarea id="nc-desc" rows="4" placeholder="Detalhes da solicitação..."></textarea></div>'
    +'<div class="modal-field"><label>CLIENTE</label><select id="nc-cliente">'+opts+'</select></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
    +'<div class="modal-field"><label>PRIORIDADE</label><select id="nc-prioridade"><option value="baixa">🔵 Baixa</option><option value="media" selected>🟡 Média</option><option value="alta">🔴 Alta</option></select></div>'
    +'<div class="modal-field"><label>DATA DE ENTREGA</label><input type="date" id="nc-data-entrega" style="color-scheme:dark"></div>'
    +'</div>'
    +'<div class="modal-field"><label>DESTINATÁRIO</label><select id="nc-destinatario"><option value="lucas">Lucas</option><option value="jean">Jean</option></select></div>'
    +'<div class="modal-actions">'
    +'<button class="btn-sec" onclick="fecharModalCard()">Cancelar</button>'
    +'<button class="btn-lucas" id="btn-criar-card">Criar Demanda</button>'
    +'</div></div></div>';
}

function bindModalCard(){
  var btn=document.getElementById('btn-criar-card');
  if(!btn)return;
  btn.onclick=async function(){
    var titulo=document.getElementById('nc-titulo').value.trim();
    if(!titulo){showToast('Digite o título');return;}
    var selEl=document.getElementById('nc-cliente');
    var clienteId=selEl.value;
    var clienteNome=selEl.options[selEl.selectedIndex].text;
    if(clienteId==='geral')clienteNome='Geral';
    btn.disabled=true;btn.textContent='Criando...';
    var prioridade=document.getElementById('nc-prioridade').value;
    var dataEntrega=document.getElementById('nc-data-entrega').value;
    var destinatario=(document.getElementById('nc-destinatario')||{value:'lucas'}).value||'lucas';
    var data={action:'salvarCard',titulo:titulo,descricao:document.getElementById('nc-desc').value.trim(),
      clienteId:clienteId,clienteNome:clienteNome,criadoPor:state.usuario,mesAno:state.mesAtual,
      prioridade:prioridade,dataEntrega:dataEntrega,destinatario:destinatario};
    var res=await apiCall(data);
    if(res&&res.ok){
      // Salva localmente
      var cards=getCards();
      cards.push({id:res.id,titulo:titulo,descricao:data.descricao,clienteId:clienteId,clienteNome:clienteNome,
        criadoPor:state.usuario,mesAno:state.mesAtual,status:'aberto',nota:null,feedback:'',
        prioridade:prioridade,dataEntrega:dataEntrega,destinatario:destinatario,
        folderId:res.folderId||'',folderUrl:res.folderUrl||'',criadoEm:new Date().toISOString(),atualizadoEm:new Date().toISOString()});
      setStore('cards',cards);_cacheCards=cards;
      showToast('✓ Demanda criada! Pasta no Drive criada.');
    }else{
      // Offline: salva local
      var id='c'+Date.now();
      var cards=getCards();
      cards.push({id:id,titulo:titulo,descricao:data.descricao,clienteId:clienteId,clienteNome:clienteNome,
        criadoPor:state.usuario,mesAno:state.mesAtual,status:'aberto',nota:null,feedback:'',
        prioridade:prioridade,dataEntrega:dataEntrega,
        folderId:'',folderUrl:'',criadoEm:new Date().toISOString(),atualizadoEm:new Date().toISOString()});
      setStore('cards',cards);_cacheCards=cards;
      showToast('⚠ Salvo localmente (sem API)');
    }
    fecharModalCard();render();
  };
}

function fecharModalCard(){
  var m=document.getElementById('modal-novo-card');
  if(m)m.remove();
  state.lucasModal=false;
}

function moverStatusCard(cardId,novoStatus){

  cards[idx].status=novoStatus;
  cards[idx].atualizadoEm=new Date().toISOString();

  if(novoStatus==='feito'&&!cards[idx].dataConclusao){
    cards[idx].dataConclusao=new Date().toISOString();

  }

  if(APPS_SCRIPT_URL)apiCall(payload);
  showToast('Status: '+statusLabel(novoStatus));render();
}

function handleFileSelect(input){
  var files=Array.from(input.files);
  files.forEach(function(f){state.lucasUploadQueue.push(f);});
  input.value='';render();
}
function handleFileDrop(e){
  e.preventDefault();
  document.getElementById('upload-area-drop').classList.remove('drag');
  var files=Array.from(e.dataTransfer.files);
  files.forEach(function(f){state.lucasUploadQueue.push(f);});
  render();
}
function removerDaFila(idx){state.lucasUploadQueue.splice(idx,1);render();}

async function enviarAnexosFila(cardId){
  if(!APPS_SCRIPT_URL){showToast('Configure a API primeiro');return;}
  var fila=state.lucasUploadQueue.slice();
  if(!fila.length)return;
  var card=getCards().find(function(c){return c.id===cardId;});
  var folderId=card?card.folderId:'';
  showToast('Enviando '+fila.length+' arquivo(s)...');
  var ok=0;
  for(var i=0;i<fila.length;i++){
    var f=fila[i];
    try{
      var base64=await lerBase64(f);
      var res=await apiPost({action:'uploadAnexo',cardId:cardId,folderId:folderId,
        nome:f.name,tipo:f.type,tamanho:String(f.size),base64:base64,enviadoPor:state.usuario});
      if(res&&res.ok){
        if(!state.lucasCardAnexos[cardId])state.lucasCardAnexos[cardId]=[];
        state.lucasCardAnexos[cardId].push({nome:f.name,tipo:f.type,tamanho:String(f.size),driveUrl:res.driveUrl,driveId:res.driveId,enviadoPor:state.usuario,enviadoEm:new Date().toISOString()});
        ok++;
      }
    }catch(e){console.warn('Upload erro:',e);}
  }
  state.lucasUploadQueue=[];
  showToast('✓ '+ok+'/'+fila.length+' enviado(s) para o Drive!');render();
}

function lerBase64(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(e){
      var b64=e.target.result.split(',')[1];
      resolve(b64);
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function removerAnexo(cardId,idx){
  var anexos=state.lucasCardAnexos[cardId]||[];
  var anexo=anexos[idx];
  if(!anexo)return;
  if(!confirm('Remover "'+anexo.nome+'" do Drive?'))return;
  if(APPS_SCRIPT_URL&&anexo.driveId){
    apiCall({action:'deletarAnexo',driveId:anexo.driveId,cardId:cardId});
  }
  state.lucasCardAnexos[cardId].splice(idx,1);
  showToast('Anexo removido');render();
}

function initLucasJeanDnd(prefix){
  if(typeof Sortable==='undefined')return;
  var cols=['aberto','em_andamento','feito'];
  cols.forEach(function(st){
    var el=document.querySelector('.kanban-col-body.'+prefix+'-col-'+st);
    if(!el)return;
    // Destroy existing sortable if present
    if(el._sortable){el._sortable.destroy();el._sortable=null;}
    el._sortable=Sortable.create(el,{
      group:prefix+'-kanban',
      animation:150,
      ghostClass:'sortable-ghost',
      dragClass:'sortable-drag',
      filter:'button',
      preventOnFilter:false,
      onStart:function(evt){evt.item._dragging=true;},
      onEnd:function(evt){
        var id=evt.item.dataset.cardId;
        var novoStatus=evt.to.dataset.cardStatus;
        setTimeout(function(){evt.item._dragging=false;},200);
        if(!id||!novoStatus)return;
        if(evt.from===evt.to&&evt.oldIndex===evt.newIndex)return;
        moverStatusCard(id,novoStatus);
        render();
      }
    });

  });
}
